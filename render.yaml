# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: basa-sebasa
    runtime: docker
    rootDir: basa-sebasa/platform
    plan: starter            # a persistent disk needs a paid plan
    healthCheckPath: /health
    disk:
      name: basa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: manual
      - key: BASE_URL
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ECOCASH_MERCHANT_CODE
        sync: false
