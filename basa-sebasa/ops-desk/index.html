<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basa seBasa Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an operator's desk. Sticky top bar, then list + detail side by side on wide screens; one column on phones. */
:root {
  --bg: #F2F1EC; --surface: #FFFFFF; --sunk: #E9E7E0; --ink: #17150F; --muted: #67635A; --line: #DBD8CF;
  --gold: #E3A400; --gold-ink: #7E5A00; --on-gold: #17150F;
  --good: #2D7A4E; --good-bg: #E3F1E8; --warn: #9A5B00; --warn-bg: #FBEFD6; --bad: #A8281F; --bad-bg: #F8E2DF;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12110D; --surface: #1C1A15; --sunk: #25221C; --ink: #F1EEE5; --muted: #A49F92; --line: #36332B;
  --gold: #F2B90F; --gold-ink: #F2C23A; --on-gold: #17150F;
  --good: #63C58D; --good-bg: #183223; --warn: #EDB060; --warn-bg: #3A2A12; --bad: #F2867C; --bad-bg: #3D1E1B;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12110D; --surface: #1C1A15; --sunk: #25221C; --ink: #F1EEE5; --muted: #A49F92; --line: #36332B;
  --gold: #F2B90F; --gold-ink: #F2C23A; --on-gold: #17150F;
  --good: #63C58D; --good-bg: #183223; --warn: #EDB060; --warn-bg: #3A2A12; --bad: #F2867C; --bad-bg: #3D1E1B;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .005em; text-wrap: balance; margin: 0; }
h2 { font-size: 22px; } h3 { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1280px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 38px; height: 38px; border-radius: 9px; background: var(--on-gold); color: var(--gold); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; position: relative; }
.mark::after { content: ""; position: absolute; width: 7px; height: 7px; background: var(--gold); top: 8px; right: 7px; border-radius: 1px; }
.brand b { font-family: var(--display); font-size: 21px; letter-spacing: .01em; display: block; line-height: 1.05; }
.brand b span { color: var(--gold-ink); }
.brand small { color: var(--muted); font-size: 12.5px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 7px 12px; border-radius: 8px; display: flex; gap: 6px; align-items: center; }
nav a:hover { color: var(--ink); background: var(--sunk); }
nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); box-shadow: inset 0 -2px 0 var(--gold); }
.count { background: var(--gold); color: var(--on-gold); font-size: 11.5px; padding: 0 6px; border-radius: 9px; font-weight: 700; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13.5px; }

main { max-width: 1280px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.note { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--ink); }

/* jobs */
.split { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.jobs { display: grid; }
.jobrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.jobrow:last-child { border-bottom: 0; }
.jobrow:hover { background: var(--sunk); }
.jobrow[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--gold); }
.jobrow .who { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobrow .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--sunk); color: var(--muted); align-self: start; }
.pill.ops { background: var(--warn-bg); color: var(--warn); }
.pill.field { background: var(--sunk); color: var(--ink); }
.pill.done { background: var(--good-bg); color: var(--good); }
.pill.off { background: var(--bad-bg); color: var(--bad); }
.ex { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--gold-ink); border: 1px dashed var(--gold-ink); padding: 0 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }

.detail { padding: 20px; display: grid; gap: 20px; min-width: 0; }
.dhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: start; }
.dhead h2 { font-size: 26px; }
.track { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.track span { flex: 1 0 auto; min-width: 54px; font-size: 11px; color: var(--muted); border-top: 4px solid var(--line); padding-top: 5px; white-space: nowrap; }
.track span.done { border-color: var(--ink); color: var(--ink); }
.track span.now { border-color: var(--gold); color: var(--ink); font-weight: 700; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.box { background: var(--sunk); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.box p { margin: 0; overflow-wrap: anywhere; }
.money { width: 100%; border-collapse: collapse; font-size: 14px; }
.money td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.money td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.money tr.total td { font-weight: 700; border-bottom: 0; padding-top: 8px; }
.money tr.sub td { color: var(--muted); font-size: 13px; }
.action { border: 2px solid var(--gold); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.action h3 { display: flex; gap: 8px; align-items: center; }
.action h3::before { content: "Next"; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; background: var(--gold); color: var(--on-gold); padding: 2px 7px; border-radius: 4px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lab { font-size: 13px; font-weight: 600; }
input[type=text], input[type=number], input[type=tel], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px; }
textarea { min-height: 70px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; accent-color: var(--gold); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; }
.pick { display: grid; gap: 6px; }
.pick label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; background: var(--surface); }
.pick label:has(input:checked) { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.pick input { accent-color: var(--gold); }
.tag { font-size: 11px; font-weight: 700; color: var(--gold-ink); text-transform: uppercase; letter-spacing: .06em; }
.wa { background: var(--sunk); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.wa pre { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 14px; overflow-wrap: anywhere; }
.hist { display: grid; gap: 0; font-size: 13.5px; }
.hist div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.hist div:last-child { border-bottom: 0; }
.back { display: none; }

/* tables */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score { font-family: var(--display); font-size: 20px; font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.kpi.lead { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpi.lead .label { color: var(--gold); }
.sheet { padding: 20px; display: grid; gap: 18px; margin-bottom: 18px; }
.sheet > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: calc(100vw - 32px); }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split.showing .listcol { display: none; }
  .split:not(.showing) .detailcol { display: none; }
  .back { display: inline-flex; }
  .hist div { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: no-preference) { .jobrow, .chip, .btn { transition: background-color .12s, border-color .12s; } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand"><div class="mark" aria-hidden="true">B</div><div><b>BASA <span>se</span>BASA</b><small>Pilot operations desk · Harare</small></div></div>
  <nav aria-label="Sections">
    <a href="#jobs" data-nav="jobs">Jobs <span class="count" id="nav-active" hidden></span></a>
    <a href="#technicians" data-nav="technicians">Technicians</a>
    <a href="#money" data-nav="money">Money</a>
    <a href="#pricing" data-nav="pricing">Pricing</a>
  </nav>
  <button class="btn primary" id="new-job-btn" type="button">New job</button>
</div></header>

<main id="app">
  <div class="panel empty" id="boot"><h3>Opening the desk…</h3><p>Loading jobs, technicians and pricing.</p></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ---------- constants ----------
const TRADES = ["HVAC/Refrigeration", "Electrical", "Plumbing", "Appliance repair", "Auto mechanic", "Solar & inverters", "Maid / cleaning"];
const SUBURBS = ["Avondale", "Belvedere", "Borrowdale", "Budiriro", "CBD", "Chitungwiza", "Eastlea", "Glen View", "Greendale", "Hatfield", "Highfield", "Kuwadzana", "Mabelreign", "Marlborough", "Mbare", "Mount Pleasant", "Msasa", "Waterfalls"];
const JOB_TYPES = ["Repair", "Installation", "Service", "Maid"];
const MAID_TIERS = { standard: "Standard maid", verified: "Verified pro maid", premium: "Premium / home manager" };
const DEFAULT_PRICING = { commissionRate: 15, calloutFee: 9, calloutPlatformShare: 1, freeKm: 10, perKm: 0.5, ecocashChargeRate: 2, platformChargeShare: 0, fallbackChargeShare: 20, maidRates: { standard: 5, verified: 6, premium: 8 }, merchantNumber: "", diagnosisValidDays: 30, firstRefusalHours: 24, payoutWindowHours: 24 };

const FLOW = {
  Repair: ["new", "assigned", "accepted", "callout_paid", "on_way", "arrived", "quoted", "approved", "working", "completed", "paid", "paid_out", "closed"],
  Other: ["new", "assigned", "accepted", "on_way", "arrived", "working", "completed", "paid", "paid_out", "closed"],
};
const STAGE = {
  new: ["New request", "ops"], assigned: ["Waiting for technician", "field"], accepted: ["Accepted", "field"],
  callout_paid: ["Call-out paid", "field"], on_way: ["On the way", "field"], arrived: ["Arrived", "field"],
  quoted: ["Quote with customer", "ops"], approved: ["Quote approved", "field"], working: ["Working", "field"],
  completed: ["Awaiting payment", "ops"], paid: ["Payout due", "ops"], paid_out: ["Paid out", "done"], closed: ["Closed", "done"],
  deferred: ["Repair deferred", "ops"], cancelled: ["Cancelled", "off"],
};
const SHORT = { new: "Request", assigned: "Assigned", accepted: "Accepted", callout_paid: "Call-out", on_way: "On way", arrived: "Arrived", quoted: "Quoted", approved: "Approved", working: "Working", completed: "Done", paid: "Paid", paid_out: "Paid out", closed: "Closed" };

// ---------- state ----------
const S = { db: null, user: null, me: null, jobs: [], techs: [], pricing: { ...DEFAULT_PRICING }, loaded: { jobs: false, techs: false, pricing: false }, filter: "active", view: "jobs", jobId: null, newJob: false, editTech: null, busy: false, readOnly: false, stale: false, people: {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const usd = (n) => "USD " + r2(n).toFixed(2);
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); };
const flowFor = (job) => FLOW[job.type === "Repair" ? "Repair" : "Other"];
const isExample = (o) => o && o.example === true;
// manual technician payouts are due within the payout window after the customer pays
function payoutDue(job) {
  if (job.stage !== "paid") return null;
  const paidAt = job.payment2?.at || job.calloutOnlyAt || job.updatedAt;
  const due = new Date(paidAt).getTime() + num(S.pricing.payoutWindowHours, 24) * 36e5;
  const left = due - Date.now();
  return { due, left, overdue: left < 0, label: left < 0 ? `Payout overdue by ${hrs(-left)}` : `Pay out within ${hrs(left)}` };
}
const hrs = (ms) => { const h = Math.floor(ms / 36e5), m = Math.round((ms % 36e5) / 6e4); return h ? `${h} h${m ? " " + m + " min" : ""}` : `${m} min`; };

function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200); }

// ---------- money ----------
function pricingFor(s) { return { ...DEFAULT_PRICING, ...(s || {}), maidRates: { ...DEFAULT_PRICING.maidRates, ...((s || {}).maidRates || {}) } }; }
function calc(job, settings) {
  const p = pricingFor(settings);
  const isRepair = job.type === "Repair", isMaid = job.type === "Maid";
  const km = num(job.distanceKm);
  const transport = r2(Math.max(0, km - p.freeKm) * p.perKm);
  const callout = isRepair ? p.calloutFee : 0;
  const calloutPlatform = isRepair ? Math.min(p.calloutPlatformShare, p.calloutFee) : 0;
  const calloutOnly = job.calloutOnly === true;
  let labour = 0, parts = 0;
  if (!calloutOnly) {
    if (isMaid) labour = r2(num(job.maidHours) * num(job.maidRate, p.maidRates[job.maidTier || "standard"]));
    else { labour = r2(num(job.quote?.labour)); parts = r2(num(job.quote?.parts)); }
  }
  const commission = r2(labour * p.commissionRate / 100);
  const payout = r2((callout - calloutPlatform) + transport + labour - commission + parts);
  const rate = p.ecocashChargeRate / 100, share = p.platformChargeShare / 100;
  // First payment (repairs): call-out + any extra distance. Second payment: the job itself (+ extra distance for non-repairs).
  const base1 = isRepair ? r2(callout + transport) : 0;
  const base2 = calloutOnly ? 0 : r2(labour + parts + (isRepair ? 0 : transport));
  const charge1 = r2(base1 * rate);
  const charge2 = r2(base2 * rate + payout * rate); // incoming payment + outgoing payout transfer
  const chargeTotal = r2(charge1 + charge2);
  const cust1 = r2(base1 + charge1 * (1 - share));
  // a deferred job closed on the call-out only has no second customer payment, so we carry its payout transfer charge
  const cust2 = calloutOnly ? 0 : r2(base2 + charge2 * (1 - share));
  const absorbed = r2(chargeTotal * share + (calloutOnly ? charge2 * (1 - share) : 0));
  const priced = !isRepair || !!job.quote || calloutOnly;
  const platform = r2(calloutPlatform + commission - absorbed);
  return { p, isRepair, isMaid, km, transport, callout, calloutPlatform, labour, parts, commission, payout, base1, base2, charge1, charge2, chargeTotal, cust1, cust2, customerTotal: priced ? r2(cust1 + cust2) : cust1, priced, absorbed, platform };
}

// ---------- trust ----------
function techStats(t) {
  const done = S.jobs.filter((j) => j.technicianId === t.id && (j.stage === "closed" || j.stage === "paid_out"));
  const rated = done.filter((j) => num(j.review?.rating) > 0);
  const rating = rated.length ? rated.reduce((s, j) => s + num(j.review.rating), 0) / rated.length : 0;
  const active = S.jobs.filter((j) => j.technicianId === t.id && !["closed", "cancelled", "paid_out", "new", "deferred"].includes(j.stage)).length;
  return { jobs: done.length, rating, ratings: rated.length, active };
}
function trust(t) {
  const st = techStats(t);
  const c = t.checks || {};
  let s = 0;
  if (c.id) s += 15; if (c.qualification) s += 20; if (c.references) s += 10; if (c.warranty) s += 10; if (c.police) s += 10; if (c.inspected) s += 10;
  s += Math.min(10, Math.round(num(t.years) * 2));
  s += st.ratings ? Math.round(st.rating / 5 * 10) : 0;
  s += Math.round(Math.min(st.jobs, 20) / 20 * 5);
  return Math.min(100, s);
}
const canVerify = (t) => t.checks?.id && t.checks?.qualification;

// ---------- data ----------
async function boot() {
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  S.db = db; S.user = user;
  if (!db) return renderNoStore();
  try { S.me = user ? await user.me() : null; } catch (e) { S.me = null; }
  try { const w = user ? await user.can("data.write") : null; S.readOnly = w === false; } catch (e) {}
  const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
  const settle = (k) => (snap) => { if (!snap.metadata || !snap.metadata.fromCache) { S.stale = false; } S.loaded[k] = true; if (Object.values(S.loaded).every(Boolean)) clearTimeout(timer); };
  const fail = (e) => { clearTimeout(timer); if (e && (e.code === "revoked" || e.code === "not_granted")) return renderNoStore(); toast("Couldn't load data: " + (e?.message || "unknown error"), true); };
  db.collection("jobs").onSnapshot((snap) => { S.jobs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))); settle("jobs")(snap); render(); }, fail);
  db.collection("technicians").onSnapshot((snap) => { S.techs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name))); settle("techs")(snap); render(); }, fail);
  db.doc("settings/pricing").onSnapshot((snap) => { S.pricing = pricingFor(snap.exists ? snap.data() : null); settle("pricing")(snap); render(); }, fail);
}
async function write(fn, okMsg) {
  if (S.busy) return false;
  if (S.readOnly) { toast("You have view-only access to this desk.", true); return false; }
  S.busy = true;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e?.code === "invalid_argument") { S.readOnly = true; toast("This change was refused. You may not have edit access.", true); }
    else if (e?.code === "quota_exceeded") toast("The desk's storage is full. Delete old example records first.", true);
    else toast("Couldn't save: " + (e?.message || "try again"), true);
    return false;
  } finally { S.busy = false; }
}
const histEntry = (stage, note) => ({ stage, note: note || "", at: new Date().toISOString(), by: S.me?.id || null });
function nextCode() { const n = S.jobs.reduce((m, j) => Math.max(m, parseInt(String(j.code || "").replace(/\D/g, ""), 10) || 0), 0) + 1; return "BSB-" + String(n).padStart(4, "0"); }

// ---------- routing ----------
function readHash() {
  const h = (location.hash || "").slice(1);
  S.newJob = false;
  if (h.startsWith("job-")) { S.view = "jobs"; S.jobId = h.slice(4); }
  else if (["jobs", "technicians", "money", "pricing"].includes(h)) { S.view = h; if (h === "jobs") S.jobId = null; }
  else { S.view = "jobs"; }
}

// ---------- render ----------
function renderNoStore() {
  $("#app").innerHTML = `<div class="panel empty"><h3>This desk needs you signed in</h3><p>Open it on claude.ai while signed in with owner or editor access. Job records, customer numbers and payments are only shown to the Basa seBasa team.</p></div>`;
  $("#new-job-btn").hidden = true;
}
function render() {
  if (!S.db) return;
  document.querySelectorAll("[data-nav]").forEach((a) => { if (a.dataset.nav === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const active = S.jobs.filter((j) => !["closed", "cancelled"].includes(j.stage)).length;
  const c = $("#nav-active"); c.hidden = !active; c.textContent = active;
  $("#new-job-btn").hidden = S.readOnly;
  const html = (S.stale ? `<div class="note">The desk can't reach its records right now. What you see may be out of date.</div>` : "") +
    (S.readOnly ? `<div class="note">You have view-only access. Ask Dex for editor access to update jobs.</div>` : "") +
    (S.view === "technicians" ? viewTechs() : S.view === "money" ? viewMoney() : S.view === "pricing" ? viewPricing() : viewJobs());
  const keep = S.skipRestore ? {} : captureForm();
  S.skipRestore = false;
  $("#app").innerHTML = html;
  restoreForm(keep);
  if (S.newJob) syncNewJob();

}
// keep typed values across live re-renders
function captureForm() { const out = {}; document.querySelectorAll("#app [id]").forEach((el) => { if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) out[el.id] = el.type === "checkbox" || el.type === "radio" ? el.checked : el.value; }); out.__focus = document.activeElement?.id; return out; }
function restoreForm(k) { Object.entries(k).forEach(([id, v]) => { if (id === "__focus") return; const el = document.getElementById(id); if (!el) return; if (el.type === "checkbox" || el.type === "radio") el.checked = v; else el.value = v; }); if (k.__focus) document.getElementById(k.__focus)?.focus(); }

async function onSubmit(form) {
  const job = S.jobs.find((j) => j.id === S.jobId); if (!job) return;
  const act = form.dataset.form; const err = $("#err-" + act);
  const fail = (msg) => { err.textContent = msg; err.hidden = false; return false; };
  const ref = db().doc("jobs/" + job.id);
  const hist = (stage, note) => [...(job.history || []), histEntry(stage, note)];
  const go = (stage, patch, note, msg) => write(() => ref.update({ ...patch, stage, updatedAt: new Date().toISOString(), history: hist(stage, note) }), msg);
  switch (act) {
    case "assign": {
      const pick = form.querySelector('input[name="a-tech"]:checked'); if (!pick) return fail("Choose a technician.");
      const km = $("#a-km").value; if (km === "") return fail("Enter the distance so the travel cost is right.");
      const patch = { technicianId: pick.value, distanceKm: num(km) };
      if (job.type === "Installation" || job.type === "Service") {
        const lab = $("#a-labour").value; if (lab === "" || num(lab) <= 0) return fail("Enter the price agreed with the customer.");
        patch.quote = { labour: num(lab), parts: num($("#a-parts").value), agreedAt: new Date().toISOString() };
      }
      const t = S.techs.find((x) => x.id === pick.value);
      return go("assigned", patch, `Sent to ${t?.name || "technician"}`, "Job sent to technician");
    }
    case "accept": return go("accepted", {}, "", "Marked accepted");
    case "callout": {
      const r = $("#p1-ref").value.trim(); if (!r) return fail("Enter the EcoCash reference."); if (!$("#p1-ok").checked) return fail("Confirm you checked the merchant statement.");
      const m = calc(job, S.pricing);
      return go("callout_paid", { payment1: { ref: r, amount: m.cust1, at: new Date().toISOString(), by: S.me?.id || null } }, `EcoCash ${r} · ${usd(m.cust1)}`, "Call-out recorded");
    }
    case "onway": {
      if (!$("#ow-loc").checked) return fail("Live location is required before the technician travels.");
      return go("on_way", { locationShared: true, etaMinutes: num($("#ow-eta").value) || null }, $("#ow-eta").value ? `ETA ${$("#ow-eta").value} min` : "", "Marked on the way");
    }
    case "arrive": return go("arrived", {}, "", "Marked arrived");
    case "quote": {
      const d = $("#q-diag").value.trim(), l = $("#q-labour").value; if (!d) return fail("Write the diagnosis."); if (l === "" || num(l) < 0) return fail("Enter the labour amount.");
      return go("quoted", { diagnosis: d, quote: { labour: num(l), parts: num($("#q-parts").value), sentAt: new Date().toISOString() } }, `Labour ${usd(l)} · parts ${usd($("#q-parts").value)}`, "Quote recorded");
    }
    case "approve": return go("approved", { quote: { ...job.quote, approvedAt: new Date().toISOString() } }, "", "Quote approved");
    case "resume": return go("quoted", { resumedAt: new Date().toISOString() }, "Resumed with original technician", "Resumed");
    case "start": return go("working", { workStartedAt: new Date().toISOString() }, "", "Work started");
    case "complete": {
      if (!$("#w-cust").checked) return fail("Get the customer's confirmation on WhatsApp first.");
      const patch = { workNotes: $("#w-notes").value.trim(), workFinishedAt: new Date().toISOString() };
      if (job.type === "Maid") { const h = num($("#w-hours").value); if (h <= 0) return fail("Enter the hours worked."); patch.maidHours = h; }
      return go("completed", patch, patch.workNotes, "Job complete");
    }
    case "pay": {
      const r = $("#p2-ref").value.trim(); if (!r) return fail("Enter the EcoCash reference."); if (!$("#p2-ok").checked) return fail("Confirm you checked the exact amount.");
      const m = calc(job, S.pricing);
      return go("paid", { payment2: { ref: r, amount: m.cust2, at: new Date().toISOString(), by: S.me?.id || null }, settled: settlement(job) }, `EcoCash ${r} · ${usd(m.cust2)}`, "Payment recorded");
    }
    case "payout": {
      const r = $("#po-ref").value.trim(); if (!r) return fail("Enter the payout reference.");
      const m = calc(job, S.pricing);
      return go("paid_out", { payout: { ref: r, amount: m.payout, at: new Date().toISOString(), by: S.me?.id || null }, settled: job.settled || settlement(job) }, `${usd(m.payout)} · ${r}`, "Payout recorded");
    }
    case "close": {
      const rt = $("#rv-rating").value; const patch = {};
      if (rt) patch.review = { rating: num(rt), text: $("#rv-text").value.trim(), at: new Date().toISOString() };
      return go("closed", patch, rt ? `Rated ${rt}/5` : "Closed without a rating", "Job closed");
    }
  }
}
// freeze the money split at payment time, so later pricing changes don't rewrite history
function settlement(job) { const m = calc(job, S.pricing); return { customerTotal: m.customerTotal, payout: m.payout, platform: m.platform, commission: m.commission, calloutPlatform: m.calloutPlatform, absorbed: m.absorbed, charges: m.chargeTotal, rate: m.p.commissionRate }; }

async function onAction(act) {
  const job = S.jobs.find((j) => j.id === S.jobId);
  if (act === "delete-job") { if (!confirmStep("delete-job")) return; await write(() => db().doc("jobs/" + job.id).delete(), "Record deleted"); location.hash = "#jobs"; return; }
  if (!job) return;
  const ref = db().doc("jobs/" + job.id);
  const now = new Date().toISOString();
  const up = (stage, patch, note, msg) => write(() => ref.update({ ...patch, stage, updatedAt: now, history: [...(job.history || []), histEntry(stage, note)] }), msg);
  if (act === "cancel") { if (!confirmStep("cancel")) return; return up("cancelled", {}, "Cancelled by team", "Job cancelled"); }
  if (act === "decline") return up("new", { technicianId: null, quote: job.type === "Repair" ? null : job.quote }, "Technician declined", "Back to matching");
  if (act === "defer") { const until = new Date(Date.now() + S.pricing.diagnosisValidDays * 864e5).toISOString(); return up("deferred", { diagnosisValidUntil: until, deferredAt: now }, "Customer will repair later", "Diagnosis saved"); }
  if (act === "reassign") { if (!confirmStep("reassign")) return; return up("new", { technicianId: null, previousTechnicianId: job.technicianId, quote: null, reassigned: true }, "Original technician declined or didn't answer", "Back to matching"); }
  if (act === "calloutonly") { if (!confirmStep("calloutonly")) return; const j2 = { ...job, calloutOnly: true }; return up("paid", { calloutOnly: true, calloutOnlyAt: now, settled: settlement(j2) }, "Closed on call-out only; technician payout due", "Payout due for call-out"); }
}

function confirmStep(key) { const b = document.querySelector(`[data-act="${key}"]`); if (b && b.dataset.armed === "1") return true; if (b) { b.dataset.armed = "1"; b.dataset.label = b.textContent; b.textContent = "Press again to confirm"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = b.dataset.label; } }, 4000); } return false; }

  await write(() => db().doc("settings/pricing").set(body), "Pricing saved");
}

// ---------- events ----------
document.addEventListener("click", async (e) => {
  const fb = e.target.closest("[data-filter]"); if (fb) { S.filter = fb.dataset.filter; render(); return; }
  const et = e.target.closest("[data-edit-tech]"); if (et) { S.editTech = et.dataset.editTech || null; S.skipRestore = true; render(); if (S.editTech) window.scrollTo(0, 0); return; }
  const ab = e.target.closest("[data-act]"); if (ab) {
    if (ab.dataset.act === "delete-tech") { if (!confirmStep("delete-tech")) return; const id = S.editTech; if (await write(() => db().doc("technicians/" + id).delete(), "Example deleted")) { S.editTech = null; render(); } return; }
    onAction(ab.dataset.act); return;
  }
  const cp = e.target.closest("[data-copy]"); if (cp) {
    const el = document.getElementById(cp.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); toast("Copied. Paste it into WhatsApp."); }
    catch (x) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Copy it with your keyboard or long-press."); }
  }
});
$("#new-job-btn").addEventListener("click", () => { if (location.hash !== "#jobs") history.replaceState(null, "", "#jobs"); S.view = "jobs"; S.newJob = true; S.skipRestore = true; render(); window.scrollTo(0, 0); });
document.addEventListener("change", (e) => { if (e.target.id === "n-cat" || e.target.id === "n-type") syncNewJob(); });
document.addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target; const k = f.dataset.form;
  if (k === "newjob") createJob(); else if (k === "tech") saveTech(); else if (k === "pricing") savePricing(); else onSubmit(f);
});

readHash();
boot();
setInterval(() => { if (S.db && S.jobs.some((j) => j.stage === "paid") && !document.activeElement?.closest?.("form")) render(); }, 60000);
// expose the money maths for checking
window.__basaCalc = calc;
})();
</script>
