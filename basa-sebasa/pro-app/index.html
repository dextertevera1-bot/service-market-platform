<body>
<title>Basa seBasa Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one installable phone app. Centred column (max 480px), dark status header, big tap targets, bottom tab bar once approved. Ink and gold from the Basa seBasa logo; high contrast for sunlight. */
:root {
  --bg: #F4F2EC; --card: #FFFFFF; --sunk: #EAE7DF; --ink: #14120D; --muted: #67635A; --line: #DCD8CE;
  --gold: #F0AE00; --gold-deep: #865F00; --on-gold: #14120D;
  --good: #1F7646; --good-bg: #DFF1E5; --bad: #A3271D; --bad-bg: #F8E0DC; --warn-bg: #FCEECC;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #14120D; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.02; margin: 0; text-wrap: balance; }
h2 { font-size: 32px; text-transform: uppercase; }
h3 { font-size: 21px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.banner { background: var(--gold); color: var(--on-gold); font-size: 12.5px; font-weight: 600; text-align: center; padding-block: 5px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.offline { background: #A3271D; color: #fff; font-size: 13.5px; font-weight: 600; text-align: center; padding-block: 6px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* header */
.head { background: #14120D; color: #F5F1E6; padding-block: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.who { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 10px; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 26px; flex: none; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who b { font-size: 18px; display: block; line-height: 1.1; }
.who small { color: #B9B2A2; font-size: 13.5px; }
.level { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: #F0AE00; color: #14120D; padding: 1px 6px; border-radius: 4px; vertical-align: 2px; margin-left: 4px; }
.trust { margin-left: auto; text-align: center; }
.trust b { font-family: var(--display); font-size: 30px; font-weight: 800; color: #F0AE00; line-height: 1; display: block; }
.trust small { font-size: 10.5px; color: #B9B2A2; text-transform: uppercase; letter-spacing: .08em; }
.online { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
.online span b { display: block; font-size: 16px; }
.online span small { color: #B9B2A2; font-size: 13px; }
.switch { position: relative; width: 62px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 17px; background: #4A463D; transition: background .2s; }
.switch i::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #F5F1E6; top: 4px; left: 4px; transition: transform .2s; }
.switch input:checked + i { background: #2FA463; }
.switch input:checked + i::after { transform: translateX(28px); }

main { flex: 1; padding-block: 16px 100px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px solid var(--ink); background: transparent; padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none; text-align: center; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.quiet { border-color: var(--line); font-weight: 600; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 14.5px; border-radius: 11px; width: auto; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toprow { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform: scale(.98); } .btn { transition: transform .1s; } }

/* forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lab { font-weight: 600; font-size: 14.5px; }
input[type=text], input[type=tel], input[type=number], textarea, select { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; font-size: 16px; }
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 84px; resize: vertical; }
.code { font-family: var(--mono); font-size: 28px; letter-spacing: .4em; text-align: center; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--gold); flex: none; }
.err { color: var(--bad); font-weight: 600; font-size: 14.5px; }
.ok { color: var(--good); font-weight: 700; }
.no { color: var(--muted); }
.note { background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note.good { background: var(--good-bg); color: var(--good); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--sunk); }
.chip.static { cursor: default; background: var(--sunk); border-color: transparent; }
.chip.hot { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.warm { background: var(--warn-bg); color: var(--gold-deep); border-color: transparent; }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--gold); }
.doc { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.doc.done { border-color: var(--good); }
.thumb { width: 56px; height: 40px; border-radius: 6px; background: var(--sunk); object-fit: cover; display: block; }
.doc b { display: block; font-size: 14.5px; }
.doc small { color: var(--muted); font-size: 12.5px; display: block; overflow-wrap: anywhere; }
.up { position: relative; overflow: hidden; }
.up input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.autolist { display: grid; gap: 8px; }
.autolist div { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.autolist i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; flex: none; background: var(--sunk); color: var(--muted); }
.autolist i.ok { background: var(--good-bg); color: var(--good); }
.autolist i.no { background: var(--bad-bg); color: var(--bad); }
.tl { display: grid; }
.tl div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 12px; position: relative; font-size: 15px; }
.tl div::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); margin-top: 4px; z-index: 1; }
.tl div::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.tl div:last-child::after { display: none; }
.tl div.done::before { background: var(--good); border-color: var(--good); }
.tl div.now::before { background: var(--gold); border-color: var(--gold); }
.tl div.no::before { background: var(--bad); border-color: var(--bad); }
.tl small { display: block; color: var(--muted); font-size: 12.5px; }
.msgs { display: grid; gap: 8px; }
.msg { background: var(--good-bg); border-radius: 12px 12px 12px 4px; padding: 9px 12px; font-size: 14.5px; }
.msg time { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.big { font-family: var(--display); font-weight: 800; font-size: 60px; line-height: 1; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good); }

/* jobs */
.request { border: 3px solid var(--gold); border-radius: 20px; background: var(--card); padding: 18px; display: grid; gap: 14px; }
.count { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }
.earn { background: var(--good-bg); color: var(--good); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.earn b { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--sunk); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.facts b { display: block; font-size: 16.5px; overflow-wrap: anywhere; }
.facts small { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.passport { border-left: 4px solid var(--gold); background: var(--sunk); padding: 10px 12px; display: grid; gap: 4px; font-size: 14.5px; }
.passport b { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-deep); }
.stagehead { background: #14120D; color: #F5F1E6; border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.stagehead .muted { color: #B9B2A2; }
.stagehead h2 { color: #F5F1E6; }
.sos { background: #A3271D; color: #fff; border: 0; border-radius: 999px; font-weight: 800; font-size: 13px; letter-spacing: .06em; padding: 6px 12px; cursor: pointer; }
.map { border-radius: 14px; overflow: hidden; background: #22201A; aspect-ratio: 16 / 10; max-width: 100%; position: relative; }
.map svg { width: 100%; height: 100%; display: block; }
.eta { position: absolute; left: 10px; top: 10px; background: #F0AE00; color: #14120D; border-radius: 10px; padding: 5px 10px; font-weight: 700; font-size: 14px; }
.gpsbox { position: absolute; right: 10px; bottom: 10px; background: rgba(20,18,13,.85); color: #F5F1E6; border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.loc { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #B9B2A2; }
.dotlive { width: 9px; height: 9px; border-radius: 50%; background: #2FA463; flex: none; }
.dotlive.off { background: #E0A13A; }
@media (prefers-reduced-motion: no-preference) { .dotlive { animation: blink 1.4s ease-in-out infinite; } @keyframes blink { 50% { opacity: .3; } } }
.split { width: 100%; border-collapse: collapse; font-size: 15px; }
.split td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.split td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.split tr.you td { font-weight: 800; font-size: 18px; border-bottom: 0; color: var(--good); padding-top: 9px; }
.timer { font-family: var(--display); font-weight: 800; font-size: 60px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.wait { display: flex; gap: 12px; align-items: center; background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; }
.stagehead .wait { background: rgba(255,255,255,.08); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold-deep); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { border: 2px dashed var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; font-size: 14px; display: grid; gap: 4px; cursor: pointer; position: relative; min-width: 0; overflow-wrap: anywhere; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo.done { border-style: solid; border-color: var(--good); color: var(--good); }
.checklist { display: grid; gap: 8px; }
.tick { display: flex; gap: 10px; align-items: center; font-size: 15.5px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--good); flex: none; }
.tick:has(input:checked) { border-color: var(--good); background: var(--good-bg); }
.report { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; font-size: 14.5px; background: var(--sunk); }
.report dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.report dt { color: var(--muted); }
.report dd { margin: 0; overflow-wrap: anywhere; }
.sheet { border: 2px solid var(--bad); }
.stars { display: flex; gap: 4px; }
.stars button { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--line); font-size: 34px; line-height: 1; }
.stars button.on { color: var(--gold); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi.lead { background: #14120D; color: #F5F1E6; border-color: #14120D; }
.kpi.lead .eyebrow { color: #F0AE00; }
.kpi.lead .small { color: #B9B2A2; }
.goal { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--good); }
.list .row2 { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .row2:last-child { border-bottom: 0; }
.row2 > span:first-child { min-width: 0; }
.row2 b { display: block; }
.row2 small { color: var(--muted); font-size: 13px; }
.row2 .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.checks { display: grid; gap: 8px; }
.checks div { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ladder div { border-radius: 10px; padding: 8px 6px; text-align: center; background: var(--sunk); font-size: 12.5px; }
.ladder div b { display: block; font-size: 14px; }
.ladder div.me { background: #14120D; color: #F0AE00; }
.empty { text-align: center; padding: 26px 10px; display: grid; gap: 10px; justify-items: center; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; font-size: 12.5px; font-weight: 600; position: relative; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 6px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 16px; font-weight: 600; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }
</style>

<div class="shell">
  <div class="banner" id="banner">Pilot preview: sample jobs and payments. Nothing real is charged.</div>

<script>
(() => {
"use strict";
// =====================================================================
// CONFIG: the same business rules as the ops desk and the contract

function earnings(j) {
