<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basa seBasa Live Link Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: three columns. The customer's chat phone on the left, the Basa seBasa server log in the middle, the technician's Pro app phone on the right. On phones a switch shows one column at a time. */
:root {
  --bg: #F4F2EC; --card: #FFFFFF; --sunk: #EAE7DF; --ink: #14120D; --muted: #67635A; --line: #DCD8CE;
  --gold: #F0AE00; --gold-deep: #865F00; --on-gold: #14120D;
  --good: #1F7646; --good-bg: #DFF1E5; --bad: #A3271D; --bad-bg: #F8E0DC; --warn-bg: #FCEECC;
  --chat-bg: #E9E3D8; --chat-in: #FFFFFF; --chat-out: #DCF5D0; --chat-head: #0E5E4E; --chat-accent: #0E7C66; --chat-meta: #6F7A74;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  --chat-bg: #10161A; --chat-in: #1E2A30; --chat-out: #11493D; --chat-head: #17262D; --chat-accent: #4FC3A1; --chat-meta: #8FA19A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  --chat-bg: #10161A; --chat-in: #1E2A30; --chat-out: #11493D; --chat-head: #17262D; --chat-accent: #4FC3A1; --chat-meta: #8FA19A;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.42; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #14120D; }
h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.04; margin: 0; text-wrap: balance; }
h2 { font-size: 28px; text-transform: uppercase; }
h3 { font-size: 19px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }

/* top bar */
.top { background: #14120D; color: #F5F1E6; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top-in { max-width: 1320px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 34px; height: 34px; border-radius: 8px; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 23px; flex: none; }
.logo b { font-family: var(--display); font-size: 21px; letter-spacing: .02em; white-space: nowrap; }
.logo b i { font-style: normal; color: #F0AE00; }
.logo small { display: block; color: #B9B2A2; font-size: 12.5px; }
.auto { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #CFC9BA; cursor: pointer; }
.auto input { width: 18px; height: 18px; accent-color: #F0AE00; }
.reset { border: 1px solid #4A463D; background: transparent; color: #CFC9BA; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.switch { display: none; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; width: 100%; }
.switch button { flex: 1; border: 0; background: transparent; color: #CFC9BA; padding: 7px 8px; border-radius: 999px; font-weight: 700; font-size: 13.5px; cursor: pointer; position: relative; }
.switch button[aria-pressed="true"] { background: #F0AE00; color: #14120D; }
.switch .ping { position: absolute; top: 4px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #E5483B; }
.guide { background: var(--gold); color: var(--on-gold); }
.guide-in { max-width: 1320px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-weight: 600; font-size: 14.5px; }
.guide button { border: 1.5px solid var(--on-gold); background: transparent; color: var(--on-gold); border-radius: 999px; padding: 3px 12px; font-weight: 700; cursor: pointer; }

.stage { max-width: 1320px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr) minmax(0, 380px); gap: 18px; align-items: start; }
.label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.phone { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); height: 680px; display: flex; flex-direction: column; background: var(--bg); }

/* customer chat */
.chat-head { background: var(--chat-head); color: #fff; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex: none; }
.chat-head .mark { width: 38px; height: 38px; border-radius: 50%; }
.chat-head b { display: block; font-size: 16px; }
.chat-head small { opacity: .8; font-size: 12.5px; }
.chat { flex: 1; overflow-y: auto; background: var(--chat-bg); padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; background: var(--chat-in); color: var(--chat-meta); font-size: 12px; border-radius: 8px; padding: 3px 10px; margin-bottom: 4px; }
.msg { max-width: 86%; display: grid; gap: 0; }
.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; }
.bubble { padding: 7px 10px 6px; border-radius: 10px; font-size: 14.5px; box-shadow: 0 1px 0 rgba(0,0,0,.08); overflow-wrap: anywhere; }
.msg.in .bubble { background: var(--chat-in); border-top-left-radius: 2px; }
.msg.out .bubble { background: var(--chat-out); border-top-right-radius: 2px; }
.bubble time { display: block; text-align: right; color: var(--chat-meta); font-size: 11px; margin-top: 2px; }
.bubble b { font-weight: 700; }
.bubble .link { color: var(--chat-accent); text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-align: left; }
.bubble img { display: block; max-width: 100%; border-radius: 6px; margin-bottom: 4px; }
.code { font-family: var(--mono); font-size: 22px; letter-spacing: .3em; font-weight: 700; }
.chat-btns { display: grid; gap: 2px; margin-top: 2px; }
.chat-btns button { background: var(--chat-in); color: var(--chat-accent); border: 0; border-radius: 8px; padding: 9px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.chat-btns button:disabled { color: var(--chat-meta); cursor: default; opacity: .7; }
.chat-btns.list button { text-align: left; display: grid; gap: 1px; padding: 9px 12px; }
.chat-btns.list small { color: var(--chat-meta); font-weight: 500; font-size: 12.5px; }
.loc { display: grid; gap: 4px; }
.loc .minimap { height: 90px; border-radius: 6px; background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(0,0,0,.07) 22px 24px), repeating-linear-gradient(90deg, transparent 0 30px, rgba(0,0,0,.07) 30px 32px), #CFE3D0; display: grid; place-items: center; }
.pin { width: 16px; height: 16px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #C0392B; border: 2px solid #fff; }
.doc { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,.05); border-radius: 8px; padding: 8px 10px; cursor: pointer; border: 0; width: 100%; text-align: left; }
.doc .pdf { background: #C0392B; color: #fff; font-weight: 800; font-size: 11px; border-radius: 4px; padding: 6px 5px; white-space: nowrap; flex: none; }
.report { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13.5px; margin-top: 4px; }
.report dt { color: var(--chat-meta); }
.report dd { margin: 0; }
.typing { align-self: flex-start; background: var(--chat-in); border-radius: 10px; padding: 8px 12px; color: var(--chat-meta); font-size: 13px; }
.composer { display: flex; gap: 6px; padding: 8px; background: var(--chat-bg); border-top: 1px solid rgba(0,0,0,.06); flex: none; }
.composer input { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 10px 14px; background: var(--chat-in); font-size: 15px; }
.composer button { border: 0; border-radius: 50%; width: 42px; height: 42px; background: var(--chat-accent); color: #fff; font-weight: 800; cursor: pointer; flex: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 8px 8px; background: var(--chat-bg); flex: none; }
.chips button { border: 1px solid var(--chat-accent); background: var(--chat-in); color: var(--chat-accent); border-radius: 999px; padding: 5px 11px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 18px; z-index: 5; }
.ussd { background: #1E1E1E; color: #EDEDED; border-radius: 12px; padding: 18px; width: 100%; max-width: 300px; display: grid; gap: 12px; font-size: 15px; }
.ussd input { background: #2B2B2B; border: 1px solid #555; border-radius: 6px; padding: 9px; color: #fff; font-family: var(--mono); letter-spacing: .4em; text-align: center; font-size: 18px; }
.ussd .row { display: flex; justify-content: flex-end; gap: 18px; }
.ussd button { background: none; border: 0; color: #7FD4BF; font-weight: 700; letter-spacing: .06em; cursor: pointer; padding: 4px; }
.track { background: var(--card); border-radius: 16px; padding: 14px; width: 100%; display: grid; gap: 10px; }

/* server log */
.log { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 680px; max-height: 680px; overflow-y: auto; }
.log-row { display: grid; grid-template-columns: 44px 84px 1fr; gap: 8px; font-size: 13.5px; align-items: start; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-align: center; white-space: nowrap; }
.tag.wa { background: #DCF5D0; color: #0E5E4E; }
.tag.server { background: var(--warn-bg); color: var(--gold-deep); }
.tag.app { background: #14120D; color: #F0AE00; }
.tag.pay { background: #E3ECF8; color: #1E4E8C; }
.tag.trust { background: var(--good-bg); color: var(--good); }
.procard { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; margin: 4px 0; }
.procard .face { width: 52px; height: 52px; border-radius: 50%; background: #2F5D50; color: #F5F1E6; display: grid; place-items: center; font: 800 20px/1 var(--display); grid-row: span 2; border: 3px solid #F0AE00; }
.procard b { font-size: 15.5px; }
.procard small { color: var(--chat-meta); font-size: 12.5px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.checks span { font-size: 11.5px; font-weight: 700; color: var(--good); background: var(--good-bg); border-radius: 999px; padding: 2px 7px; }
.voice { display: flex; align-items: center; gap: 8px; min-width: 170px; }
.voice i { flex: 1; height: 16px; background: repeating-linear-gradient(90deg, var(--chat-accent) 0 2px, transparent 2px 5px); opacity: .55; border-radius: 2px; }
.guarantee { border-left: 3px solid var(--good); padding-left: 8px; margin-top: 6px; }
.sla { display: inline-block; font: 700 12px/1 var(--mono); color: var(--good); background: var(--good-bg); border-radius: 6px; padding: 3px 6px; margin-bottom: 4px; }
.explain { background: var(--sunk); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }

/* technician app */
.pro-head { background: #14120D; color: #F5F1E6; padding: 12px 14px; display: grid; gap: 10px; flex: none; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; flex: none; }
.who b { display: block; font-size: 16px; }
.who small { color: #B9B2A2; font-size: 12.5px; }
.trust { margin-left: auto; text-align: center; }
.trust b { font-family: var(--display); font-size: 26px; color: #F0AE00; line-height: 1; }
.trust small { display: block; font-size: 10px; color: #B9B2A2; text-transform: uppercase; letter-spacing: .08em; }
.status { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #2FA463; flex: none; }
.pro-body { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.offer { border: 3px solid var(--gold); }
.dark { background: #14120D; color: #F5F1E6; border-color: #14120D; }
.dark .muted { color: #B9B2A2; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; border: 2px solid var(--ink); background: transparent; padding: 11px 14px; border-radius: 12px; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.quiet { border-color: var(--line); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.earn { background: var(--good-bg); color: var(--good); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.earn b { font-family: var(--display); font-size: 28px; font-weight: 800; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.facts div { background: var(--sunk); border-radius: 10px; padding: 7px 8px; min-width: 0; }
.facts b { display: block; font-size: 15px; }
.facts small { color: var(--muted); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: 13.5px; }
.field input, .field textarea { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 10px; font-size: 15px; }
.field textarea { min-height: 60px; resize: vertical; }
.field .codein { font-family: var(--mono); font-size: 24px; letter-spacing: .4em; text-align: center; }
.tick { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.tick input { width: 18px; height: 18px; accent-color: var(--good); }
.err { color: var(--bad); font-weight: 600; font-size: 13.5px; }
.map { border-radius: 12px; overflow: hidden; background: #22201A; aspect-ratio: 16 / 10; position: relative; max-width: 100%; }
.map svg { width: 100%; height: 100%; display: block; }
.eta { position: absolute; left: 8px; top: 8px; background: #F0AE00; color: #14120D; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 13px; }
.split { width: 100%; border-collapse: collapse; font-size: 14px; }
.split td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.split td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.split tr.you td { color: var(--good); font-weight: 800; font-size: 16px; border-bottom: 0; }
.wait { display: flex; gap: 10px; align-items: center; background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.dark .wait { background: rgba(255,255,255,.08); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold-deep); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.timer { font-family: var(--display); font-weight: 800; font-size: 46px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 16px; font-weight: 600; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }

@media (max-width: 1060px) {
  .stage { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
  .switch { display: flex; }
  .stage[data-show="customer"] .pane:not(.pane-customer), .stage[data-show="server"] .pane:not(.pane-server), .stage[data-show="tech"] .pane:not(.pane-tech) { display: none; }
  .phone { height: calc(100vh - 190px); min-height: 520px; }
  .log { min-height: 0; max-height: none; }
}
</style>

<header class="top"><div class="top-in">
  <div class="logo"><span class="mark" aria-hidden="true">B</span><span><b>BASA <i>se</i>BASA</b><small>WhatsApp to Pro app: live demo, trust built into every step</small></span></div>
  <label class="auto"><input type="checkbox" id="auto"> Auto-play the technician</label>
  <button class="reset" type="button" data-act="reset">Start again</button>
  <div class="switch" role="group" aria-label="Choose a view"><button type="button" data-show="customer">Customer<span class="ping" id="ping-customer" hidden></span></button><button type="button" data-show="server">Server</button><button type="button" data-show="tech">Technician<span class="ping" id="ping-tech" hidden></span></button></div>
</div></header>
<div class="guide"><div class="guide-in"><span id="guide"></span><button type="button" id="guide-go" hidden></button></div></div>
<div class="stage" id="stage" data-show="customer">
  <section class="pane pane-customer" aria-label="Customer's phone"><div class="label"><span class="eyebrow">Customer's phone</span><span class="muted small">Chatting on WhatsApp</span></div>
    <div class="phone"><div class="chat-head"><span class="mark" aria-hidden="true">B</span><span><b>Basa seBasa</b><small>Verified business account · replies instantly</small></span></div>
      <div class="chat" id="chat" aria-live="polite"></div><div class="chips" id="chips"></div>
      <form class="composer" id="composer"><input id="typed" type="text" autocomplete="off" placeholder="Message" aria-label="Type a message"><button type="submit" aria-label="Send">➤</button></form>
      <div id="overlay"></div></div></section>
  <section class="pane pane-server" aria-label="Basa seBasa server"><div class="label"><span class="eyebrow">Basa seBasa server</span><span class="muted small">What happens behind the scenes</span></div>
    <div class="log" id="log"></div></section>
  <section class="pane pane-tech" aria-label="Technician's phone"><div class="label"><span class="eyebrow">Technician's phone</span><span class="muted small">Basa seBasa Pro app</span></div>
    <div class="phone"><div class="pro-head" id="pro-head"></div><div class="pro-body" id="pro"></div></div></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const P = { callout: 9, calloutPlatform: 1, commission: 15, rate: 2, freeKm: 10, payoutHours: 24, warrantyDays: 90 };
const SERVICES = [
  { id: "hvac", name: "Fridge & aircon", hint: "Fridge not cooling", diag: "Start relay burnt out. Compressor is fine.", labour: 40, parts: 18, checks: ["Power isolated before work", "Leak test done", "Unit cooling at handover"] },
  { id: "elec", name: "Electrical", hint: "Half the house has no power", diag: "Burnt neutral in the distribution board.", labour: 35, parts: 12, checks: ["Supply isolated and tested dead", "Earth continuity tested", "Covers refitted"] },
  { id: "plumb", name: "Plumbing", hint: "Geyser leaking", diag: "Geyser thermostat and valve failed.", labour: 30, parts: 25, checks: ["Water and power isolated", "Joints pressure-tested", "Hot water restored"] },

  if (b.dataset.chip) { if (b.dataset.chip.startsWith("🎤")) voiceNote(); else customerSays(b.dataset.chip); return; }

    const [i, k] = b.dataset.chat.split(":").map(Number), m = S.chat[i], opt = m.buttons[k]; m.used = true; const act = opt.act;
    if (act === "photo") { const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.onchange = () => { const f = inp.files?.[0]; if (!f) { m.used = false; return; } const r = new FileReader(); r.onload = () => { S.photo = r.result; me("Photo", { html: `<img src="${r.result}" alt="Photo sent">Photo` }); log("wa", "Photo received from customer, attached to the job."); typing(600, askLocation); }; r.readAsDataURL(f); }; inp.click(); m.used = false; return; }
    if (act === "location") { log("wa", "Customer tapped Share location."); bot("Which area are you in? (In the real chat, WhatsApp shares your exact pin.)", { list: true, buttons: [...SUBURBS.map((s2) => ({ html: esc(s2), act: "sub:" + s2 })), { html: `Ruwa<small>Outside our launch area: try it</small>`, act: "out:Ruwa" }] }); render(); return; }
    me(opt.label || opt.html.replace(/<small>.*$/, "").replace(/<[^>]+>/g, ""));
    if (act === "voice:ok") { S.desc = svc().hint + ", it started yesterday"; typing(500, askPhoto); return; }
    if (act === "voice:no") { typing(400, () => { bot("No problem. Type a few words about the problem."); S.step = "describe"; }); return; }
    if (act === "who:me") { log("wa", "Booking for the customer's own home."); typing(500, askService); return; }
    if (act === "who:family") { log("wa", "Customer is booking from abroad for family in Harare."); typing(600, () => { bot("Lovely, we do this a lot. Who's at the house in Harare? Type their name and WhatsApp number, for example <i>Mai Ndlovu 0772 123 456</i>.<br><br>We'll send them the pro's photo and the Basa Code, and you'll get every update, the photos and the receipt here."); S.step = "family"; }); return; }
    if (act.startsWith("out:")) { const place = act.slice(4); S.chat.pop(); me(`📍 ${place}`); log("server", `${place} is outside the launch area. Customer added to the waitlist; no empty promise made.`); typing(600, () => { bot(`We're not in <b>${esc(place)}</b> yet, so we won't send you an unchecked stranger. You're on our list, and we'll message you the day we open there.<br><br>Is the job somewhere else in Harare?`, { buttons: [{ label: "Choose another area", act: "location" }] }); S.step = "location"; }); return; }
    if (act === "face:ok") { log("trust", "Customer confirmed the person at the gate matches the photo."); typing(400, () => bot(`Thanks. Read your Basa Code <b>${esc(S.code)}</b> out to ${esc(first(S.pro.name))} when he asks.`)); S.step = "onway"; return; }
    if (act === "face:no") { log("trust", `ALERT: customer says the person at the gate isn't ${S.pro.name}. Job frozen, founder called, pro's live location checked.`); S.t = { stage: "verify" }; typing(500, () => { bot(`<b>Don't open the gate.</b> We've frozen this job and our team is calling you now. If you feel unsafe, call <b>995</b>.`, { buttons: [{ label: "Sorry, it is him", act: "face:ok" }] }); }); return; }
    if (act === "issue") { S.issue = true; log("trust", `Customer reported a problem before paying. Payout to ${S.pro.name} stays on hold; founder alerted with the photos and checklist.`); log("app", `Told ${S.pro.name}: the customer isn't happy yet, please stay on site.`); typing(600, () => { bot(`Thanks for telling us before paying. Nobody gets paid until this is sorted. What's wrong?`, { buttons: [{ label: "It still isn't working", act: "issue:fix" }, { label: "Price is not what was quoted", act: "issue:price" }] }); S.step = "issue"; }); return; }
    if (act.startsWith("issue:")) { log("server", `Issue logged: ${act === "issue:fix" ? "fault not fixed" : "price dispute"}. ${S.pro.name} asked to resolve on site; team joins the chat.`); typing(600, () => bot(act === "issue:fix" ? `${esc(first(S.pro.name))} will look again now, at no extra charge. You'll only be asked to pay once it's working. If he can't fix it, we'll send another pro.` : `You only ever pay the approved quote. Our team has the quote on file and is joining this chat now.`));
      setTimeout(() => { log("server", act === "issue:fix" ? `${S.pro.name} re-tested the unit and sent new photos.` : "Team confirmed the total matches the approved quote."); S.issue = false; bot(act === "issue:fix" ? `${esc(first(S.pro.name))} says it's working now and has sent new photos. Please check it yourself.` : "Sorted: the total is exactly the quote you approved.", { buttons: [{ label: `All good: pay ${usd(money().pay2)}`, act: "pay2" }, { label: "Still not right", act: "issue" }] }); S.step = "pay2"; render(); }, 4000);
      return; }
    if (act.startsWith("svc:")) { S.svc = act.slice(4); log("wa", `Customer chose: ${svc().name}.`); typing(600, () => { bot(`Got it: <b>${esc(svc().name)}</b>. Please describe the problem in a few words.`); S.step = "describe"; }); return; }
    if (act === "skip-photo") { log("wa", "Customer skipped the photo."); typing(500, askLocation); return; }
    if (act.startsWith("sub:")) { S.suburb = act.slice(4); S.chat.pop(); S.chat.push({ from: "out", at: clock(), html: `<div class="loc"><div class="minimap"><span class="pin"></span></div><b>Location</b><span>${esc(S.suburb)}, Harare</span></div>` }); log("wa", `Location pin received from customer (${S.suburb}).`); typing(700, confirmBooking); return; }
    if (act === "find") { typing(1100, showMatches); return; }
    if (act === "cancel") { log("server", "Customer cancelled before booking."); typing(500, () => { bot("No problem. Message us anytime."); S.step = "done"; }); return; }
    if (act.startsWith("pro:")) { const i2 = Number(act.slice(4)); offerTo(i2); typing(500, () => bot(`Asking <b>${esc(S.pro.name)}</b> now. Verified pros have 60 seconds to accept.`)); toast("The job just appeared on the technician's phone."); return; }
    if (act === "pay1" || act === "pay2") { S.pay = { which: act === "pay1" ? 1 : 2, amount: act === "pay1" ? money().pay1 : money().pay2 }; S.chat.pop(); log("pay", `Paynow: EcoCash payment request for ${usd(S.pay.amount)} sent to the customer's phone.`); render(); return; }
    if (act === "approve") { log("wa", "Customer approved the quote."); log("app", `Told ${S.pro.name}: quote approved, start work.`); S.t = { stage: "working", startedAt: Date.now() }; typing(500, () => bot(`Approved. ${esc(first(S.pro.name))} is starting now.`)); S.step = "work"; return; }
    if (act === "later") { log("wa", "Customer chose to repair later."); log("server", `Diagnosis saved for 30 days. ${S.pro.name} gets first refusal when the customer resumes.`); S.t = { stage: "deferred" }; typing(500, () => { bot(`No problem. Your diagnosis is saved for <b>30 days</b>, and ${esc(first(S.pro.name))} gets first chance to finish the job. Message "RESUME ${esc(S.job)}" when you're ready. You've only paid the call-out.`); S.step = "deferred"; }); return; }
    if (act.startsWith("rate:")) { S.rating = Number(act.slice(5)); log("wa", `Customer rated ${S.pro.name} ${S.rating} out of 5.`); log("app", `Rating shown on ${S.pro.name}'s app; Trust Score updates tonight.`); typing(500, () => { bot(`Thank you. Your warranty runs for ${P.warrantyDays} days. Message us anytime to book again.`); S.step = "done"; }); return; }
    render(); return;
  }
  const act = b.dataset.act; if (!act) return;
  if (act === "reset") { S = fresh(); autoKey = ""; $("#typed").value = ""; render(); window.scrollTo(0, 0); return; }
  if (act === "pin-cancel") { log("pay", "Customer cancelled the EcoCash prompt."); const w = S.pay.which; S.pay = null; bot("Payment not completed. Tap Pay when you're ready.", { buttons: [{ label: `Pay ${usd(w === 1 ? money().pay1 : money().pay2)} with EcoCash`, act: w === 1 ? "pay1" : "pay2" }] }); render(); return; }
  if (act === "track") { S.track = true; log("server", "Customer opened the live tracking page."); render(); return; }
  if (act === "track-close") { S.track = false; render(); return; }
  techAct(act);
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "composer") { const v = $("#typed").value; $("#typed").value = ""; customerSays(v); }
  if (e.target.id === "ussd") { const pin = $("#pin").value; if (!/^\d{4}$/.test(pin)) { const er = $("#pin-err"); er.textContent = "Enter a 4-digit PIN."; er.hidden = false; return; } const w = S.pay.which; S.pay = null; render(); typing(1400, () => paid(w)); }
});
document.addEventListener("change", (e) => { if (e.target.id === "auto") { autoKey = ""; render(); } });
setInterval(() => {
  if (S.t.stage === "offer") { const left = Math.max(0, Math.ceil((S.t.expires - Date.now()) / 1000)), c = $("#count"), b = $("#bar"); if (c) c.textContent = left + "s"; if (b) b.style.width = left / 60 * 100 + "%"; if (left <= 0) techAct("t-decline"); }
  if (S.t.stage === "working") { const el = $("#timer"); if (el) { const s = Math.floor((Date.now() - S.t.startedAt) / 1000); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } }
}, 1000);
matchMedia("(min-width: 1061px)").addEventListener?.("change", render);
render();
})();
</script>
