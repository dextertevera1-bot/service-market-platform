<style>
/* Layout: a phone-first customer app. Ink and gold from the logo; big condensed headlines; one column that widens to two on desktop. */
:root {
  --bg: #F5F3EE; --card: #FFFFFF; --sunk: #ECE9E1; --ink: #15130E; --muted: #6A665C; --line: #DEDAD0;
  --gold: #F0AE00; --gold-deep: #8A6400; --on-gold: #15130E; --night: #15130E; --night-fg: #F5F1E6;
  --good: #23784A; --good-bg: #E1F2E7; --bad: #A62A20; --bad-bg: #F8E1DD; --warn-bg: #FCEFCF;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #100F0B; --card: #1B1914; --sunk: #25221B; --ink: #F3EFE5; --muted: #A7A193; --line: #36322A;
  --gold: #F5BA14; --gold-deep: #F5C542; --on-gold: #15130E; --night: #0A0907; --night-fg: #F5F1E6;
  --good: #66C88F; --good-bg: #17301F; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #100F0B; --card: #1B1914; --sunk: #25221B; --ink: #F3EFE5; --muted: #A7A193; --line: #36322A;
  --gold: #F5BA14; --gold-deep: #F5C542; --on-gold: #15130E; --night: #0A0907; --night-fg: #F5F1E6;
  --good: #66C88F; --good-bg: #17301F; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h2 { font-size: clamp(30px, 6vw, 44px); text-transform: uppercase; }
h3 { font-size: 22px; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--night); color: var(--night-fg); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.mark { width: 36px; height: 36px; border-radius: 9px; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 25px; position: relative; }
.mark::after { content: ""; position: absolute; width: 6px; height: 6px; background: var(--on-gold); top: 8px; right: 7px; border-radius: 1px; }
.logo b { font-family: var(--display); font-size: 23px; letter-spacing: .02em; white-space: nowrap; }
.logo b i { font-style: normal; color: var(--gold); }
.topnav { display: flex; gap: 2px; }
.topnav a { text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 15px; color: #CFC9BA; white-space: nowrap; }
.topnav a:hover, .topnav a[aria-current="page"] { color: var(--night-fg); background: rgba(255,255,255,.08); }
.demo { background: var(--gold); color: var(--on-gold); font-size: 13px; font-weight: 600; text-align: center; padding: 5px 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); background: transparent; padding: 11px 20px; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 16px; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.sm { padding: 7px 14px; font-size: 14.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .12s; } .btn:active { transform: scale(.97); } }

/* hero */
.hero { background: var(--night); color: var(--night-fg); padding-block: 36px 44px; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(48px, 11vw, 104px); text-transform: uppercase; line-height: .9; letter-spacing: -.005em; }
.hero h1 span { color: var(--gold); display: block; }
.hero p.lead { font-size: 19px; color: #D9D3C4; margin-top: 16px; max-width: 34ch; }
.hero .row { margin-top: 24px; }
.hero .btn:not(.gold) { border-color: #5A554A; color: var(--night-fg); }
.promise { display: grid; gap: 10px; }
.promise div { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); padding: 12px 14px; border-radius: 12px; }
.promise svg { width: 26px; height: 26px; color: var(--gold); }
.promise b { display: block; font-size: 15.5px; }
.promise small { color: #B9B2A2; font-size: 13.5px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
section.band { padding-block: 44px; }
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
.svc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 8px; align-content: start; min-height: 132px; }
.svc:hover { border-color: var(--ink); }
.svc svg { width: 30px; height: 30px; }
.svc b { font-family: var(--display); font-size: 21px; line-height: 1.05; text-transform: uppercase; }
.svc small { color: var(--muted); font-size: 13.5px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 20px; counter-reset: s; }
.steps li { list-style: none; background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--line); display: grid; gap: 6px; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--gold-deep); line-height: 1; }
.steps ol { padding: 0; margin: 0; }
.prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
.price { background: var(--card); border-radius: 14px; padding: 20px; border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.price .big { font-family: var(--display); font-size: 46px; font-weight: 800; line-height: 1; }
.price .big small { font-size: 20px; font-weight: 600; color: var(--muted); }
.price.featured { background: var(--night); color: var(--night-fg); border-color: var(--night); }
.price.featured .muted { color: #B9B2A2; }

/* booking */
.page { padding-block: 26px 70px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.stepper { display: flex; gap: 6px; margin-bottom: 14px; }
.stepper span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.stepper span.on { background: var(--gold); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lab { font-weight: 600; font-size: 14.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
input[type=text], input[type=tel], input[type=number], select, textarea { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 12px; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 96px; resize: vertical; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; display: grid; gap: 2px; background: var(--card); text-align: left; }
.opt small { color: var(--muted); font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--sunk); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.err { color: var(--bad); font-weight: 600; font-size: 14.5px; }
.pros { display: grid; gap: 10px; }
.pro { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; background: var(--card); text-align: left; width: 100%; }
.pro[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--night); color: var(--gold); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 21px; }
.pro b { font-size: 17px; }
.pro .meta { color: var(--muted); font-size: 13.5px; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.badge { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
.score { text-align: center; }
.score b { font-family: var(--display); font-size: 30px; font-weight: 800; display: block; line-height: 1; }
.score small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); }
.money { width: 100%; border-collapse: collapse; font-size: 15px; }
.money td { padding: 7px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.money td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.money tr.total td { border-bottom: 0; font-size: 19px; font-weight: 800; padding-top: 10px; }
.money small { color: var(--muted); display: block; font-size: 13px; font-weight: 400; }
.tip { background: var(--warn-bg); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }

/* tracking */
.status { background: var(--night); color: var(--night-fg); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.status h2 { font-size: clamp(32px, 7vw, 46px); }
.status .muted { color: #B9B2A2; }
.pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 2px; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .3; transform: scale(.75); } } }
.map { border-radius: 14px; overflow: hidden; background: #22201A; aspect-ratio: 16 / 9; max-width: 100%; position: relative; }
.map svg { width: 100%; height: 100%; display: block; }
.eta { position: absolute; left: 12px; top: 12px; background: var(--gold); color: var(--on-gold); border-radius: 10px; padding: 6px 11px; font-weight: 700; font-size: 14px; }
.timeline { display: grid; gap: 0; }
.timeline div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 14px; position: relative; }
.timeline div::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); margin-top: 5px; z-index: 1; }
.timeline div::after { content: ""; position: absolute; left: 7px; top: 19px; bottom: 0; width: 2px; background: var(--line); }
.timeline div:last-child::after { display: none; }
.timeline div.done::before { background: var(--ink); border-color: var(--ink); }
.timeline div.now::before { background: var(--gold); border-color: var(--gold); }
.timeline small { color: var(--muted); display: block; font-size: 13px; }
.act { border: 2.5px solid var(--gold); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.feed { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
.feed p { background: var(--sunk); border-radius: 12px 12px 12px 4px; padding: 9px 12px; font-size: 14.5px; }
.feed time { display: block; font-size: 12px; color: var(--muted); }
.stars { display: flex; gap: 4px; }
.stars button { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--line); }
.stars button svg { width: 36px; height: 36px; }
.stars button.on { color: var(--gold); }
.list { display: grid; gap: 10px; }
.bk { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.bk:hover { border-color: var(--ink); }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); white-space: nowrap; align-self: start; }
.tag.done { background: var(--good-bg); color: var(--good); }
.empty { text-align: center; padding: 40px 20px; display: grid; gap: 12px; justify-items: center; }
footer { background: var(--night); color: #B9B2A2; padding-block: 28px; font-size: 14px; }
footer .wrap { display: grid; gap: 8px; }
footer b { color: var(--night-fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; z-index: 40; max-width: calc(100vw - 32px); }
.ecocash { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 10px 0; }
.phone { width: 150px; height: 230px; border: 3px solid var(--ink); border-radius: 24px; display: grid; place-items: center; padding: 12px; background: var(--sunk); }
.phone div { background: var(--card); border-radius: 10px; padding: 10px; font-size: 12.5px; box-shadow: 0 1px 0 var(--line); }

@media (max-width: 880px) {
  .hero .wrap, .layout { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
  .topnav a.hide-sm { display: none; }
}
@media (max-width: 520px) { .top .wrap { gap: 8px; } .topnav a { padding: 7px 7px; font-size: 14px; } .mark { width: 32px; height: 32px; font-size: 22px; } .logo b { font-size: 20px; } .pro { grid-template-columns: 46px minmax(0, 1fr) auto; } .avatar { width: 46px; height: 46px; } }
.codecard{border:2px solid var(--gold,#F0AE00)}.bigcode{font-size:44px;font-weight:700;letter-spacing:.25em;margin:4px 0 8px}.ticks{margin:8px 0;padding-left:20px;display:grid;gap:4px}
</style>

const distKm = (a, b) => { const p = POS[a] || [0, 0], q = POS[b] || [0, 0]; return Math.round(Math.hypot(p[0] - q[0], p[1] - q[1]) * 1.3 * 2) / 2 || 1.5; };

const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const usd = (n) => "$" + r2(n).toFixed(2);
function price(b) {
  const p = PRICING, rate = p.ecocashChargeRate / 100, share = p.platformChargeShare / 100;
  const transport = r2(Math.max(0, (b.km || 0) - p.freeKm) * p.perKm);
  const callout = b.type === "Repair" ? p.calloutFee : 0;
  let labour = 0, parts = 0;
  if (b.type === "Maid") labour = r2(b.hours * p.maidRates[b.tier || "standard"]);
  else if (b.quote) { labour = r2(b.quote.labour); parts = r2(b.quote.parts); }
  else if (b.type !== "Repair") labour = r2(b.agreed || 0);
  const commission = labour * p.commissionRate / 100;
  const payout = r2((callout ? callout - 1 : 0) + transport + labour - commission + parts);
  const base1 = b.type === "Repair" ? r2(callout + transport) : 0;
  const base2 = r2(labour + parts + (b.type === "Repair" ? 0 : transport));
  const fee1 = r2(base1 * rate * (1 - share));
  const fee2 = r2((base2 * rate + Math.max(0, payout) * rate) * (1 - share));
  return { transport, callout, labour, parts, base1, base2, fee1, fee2, pay1: r2(base1 + fee1), pay2: r2(base2 + fee2) };
}

function viewBookings() {
  return `<div class="wrap page"><p class="eyebrow">My jobs</p><h2 style="margin-bottom:16px">Your bookings</h2>
    ${JOBS.length ? `<div class="list">${JOBS.map((j) => `<a class="bk" href="#job-${esc(j.id)}"><b>${esc(svcOf(j.service)?.name)} · ${esc(j.pro.name)}</b><span class="tag ${j.stage === "closed" ? "done" : ""}">${esc(STAGE_TEXT[j.stage])}</span><span class="muted mono">${esc(j.code)} · ${new Date(j.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" })} · ${esc(j.suburb)}</span></a>`).join("")}</div>`
    : `<div class="card empty"><h3>No bookings yet</h3><p class="muted">Your jobs and receipts will appear here.</p><a class="btn gold" href="#book">Book a professional</a></div>`}</div>`;
}
function viewJoin() {
  return `<div class="wrap page"><div class="layout"><div style="display:grid;gap:16px"><p class="eyebrow">For professionals</p><h2>Get steady, paid work</h2>
    <p style="font-size:18px">Basa seBasa sends verified pros jobs near them, collects the money on EcoCash and pays you within 24 hours.</p>
    <div class="prices" style="margin-top:0"><div class="price"><span class="eyebrow">You keep</span><span class="big">85% <small>of labour</small></span><p class="muted">Plus 100% of parts, and $8 of every $9 call-out.</p></div><div class="price"><span class="eyebrow">Paid out</span><span class="big">24 <small>hours</small></span><p class="muted">From when the customer pays, straight to your EcoCash.</p></div></div>
    <div class="card"><h3>What you need</h3><ul style="margin:0;padding-left:20px;display:grid;gap:4px"><li>National ID</li><li>Trade qualification or proof of experience</li><li>Two references from past customers or employers</li><li>A smartphone with WhatsApp and EcoCash</li><li>Willingness to share live location during jobs</li></ul></div></div>
    <form class="card" id="join-form" novalidate><h3>Apply to join</h3>
      <div class="field"><label for="j-name">Full name</label><input id="j-name" type="text" autocomplete="name"></div>
      <div class="field"><label for="j-wa">WhatsApp number</label><input id="j-wa" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="j-trade">Trade</label><select id="j-trade">${SERVICES.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="j-sub">Where you're based</label><select id="j-sub">${SUBURBS.map((s) => `<option>${s}</option>`).join("")}</select></div>
      <div class="field"><label for="j-years">Years of experience</label><input id="j-years" type="number" min="0" inputmode="numeric"></div>
      <p class="err" id="join-err" hidden></p><button class="btn gold" type="submit">Send application</button>
      <p class="muted" style="font-size:13.5px">We'll message you on WhatsApp to book your in-person check.</p></form></div></div>`;
}
function viewHelp() {
  const q = [["How do you check professionals?", "Every pro meets our team in person. We check their National ID and trade qualification, call their references and, for home help, ask for police clearance. Their Trust Score shows what's been checked."], ["Why can't I pay in cash?", "Paying through Basa seBasa on EcoCash means every payment is recorded, you get a receipt, and we can step in if something goes wrong. If a pro asks for cash, tell us."], ["What is the call-out fee?", `For repairs, $${PRICING.calloutFee} covers the inspection and travel within ${PRICING.freeKm} km. If you decide not to repair, that's all you pay.`], ["What if I can't afford the repair today?", `Choose "Not now" on your quote. Your diagnosis stays valid for ${PRICING.diagnosisValidDays} days and your pro gets first chance to finish it.`], ["What are the EcoCash charges?", "They're EcoCash's own transaction charges, shown in your total before you pay. We never add hidden fees."], ["Something went wrong. What do I do?", "Message us on WhatsApp with your job number (it starts with BSB). A real person on our team will help you."]];
  return `<div class="wrap page"><p class="eyebrow">Help</p><h2 style="margin-bottom:16px">How we protect you</h2>
    <div class="list">${q.map(([a, b]) => `<details class="card" style="gap:8px"><summary style="cursor:pointer;font-weight:700;font-size:17px">${esc(a)}</summary><p class="muted">${esc(b)}</p></details>`).join("")}</div>
    <div class="card" style="margin-top:16px"><h3>Talk to us</h3><p>WhatsApp: <span class="mono">Basa seBasa number coming soon</span></p><p class="muted">Monday to Saturday, 7am to 7pm.</p></div></div>`;
}

// ================= EVENTS =================
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.start) { Object.assign(B, { step: 0, service: t.dataset.start, type: svcOf(t.dataset.start).types.length === 1 ? svcOf(t.dataset.start).types[0] : null }); location.hash = "#book"; if (view === "book") render(); return; }
  if (t.dataset.svc) { readStep(); B.service = t.dataset.svc; const s = svcOf(B.service); if (!s.types.includes(B.type)) B.type = s.types.length === 1 ? s.types[0] : null; render(); return; }
  if (t.dataset.type) { readStep(); B.type = t.dataset.type; render(); document.getElementById("b-desc")?.focus(); return; }
  if (t.dataset.pro) { B.pro = B.pros.find((p) => p.id === t.dataset.pro); render(); return; }
  if (t.hasAttribute("data-back")) { readStep(); B.step = Math.max(0, B.step - 1); render(); return; }
  const job = JOBS.find((j) => j.id === trackId);
  if (t.hasAttribute("data-approve") && job) { await API.approveQuote(job); return; }
  if (t.hasAttribute("data-defer") && job) { await API.deferQuote(job); return; }
  if (t.hasAttribute("data-resume") && job) { Sim.resume(job); return; }
  if (t.hasAttribute("data-receipt") && job) { await downloadReceipt(job); return; }
  if (t.dataset.star && job) { job.draftRating = Number(t.dataset.star); const keep = captureInputs(); render(); restoreInputs(keep); return; }
});
document.addEventListener("change", (e) => { if (e.target.id === "b-photo") { B.photo = e.target.files?.[0]?.name || ""; readStep(); render(); } if (e.target.id === "b-tier" || e.target.id === "b-hours") { readStep(); $(".summary").innerHTML = summary(); } });
document.addEventListener("input", (e) => { if (e.target.id === "b-hours" || e.target.id === "b-agreed") { readStep(); $(".summary").innerHTML = summary(); } });
document.addEventListener("submit", async (e) => {
  e.preventDefault(); const f = e.target;
  if (f.id === "book-form") return nextStep();
  const job = JOBS.find((j) => j.id === trackId);
  if (f.dataset.pay && job) { const n = $("#pay-num").value; if (n.replace(/\D/g, "").length < 9) { const er = $("#pay-err"); er.textContent = "Enter your EcoCash number."; er.hidden = false; return; } await API.pay(job, f.dataset.pay, n); return; }
  if (f.hasAttribute("data-review") && job) { if (!job.draftRating) { const er = $("#rv-err"); er.textContent = "Tap the stars to rate."; er.hidden = false; return; } await API.review(job, job.draftRating, $("#rv-text").value.trim()); return; }
  if (f.id === "join-form") { const er = $("#join-err"); if (!$("#j-name").value.trim() || $("#j-wa").value.replace(/\D/g, "").length < 9) { er.textContent = "Enter your name and WhatsApp number."; er.hidden = false; return; } f.outerHTML = `<div class="card empty"><h3>Application received</h3><p class="muted">${DEMO ? "In the live app, our team messages you on WhatsApp to book your check." : "We'll message you on WhatsApp to book your in-person check."}</p></div>`; }
});

// resume any preview jobs that were mid-flow when the page was last open
JOBS.forEach((j) => { if (j.stage === "requested") Sim.start(j); else if (j.stage === "on_way") Sim.travel(j); else if (j.stage === "working") Sim.finish(j); else if (j.stage === "arrived") { j.stage = "on_way"; Sim.travel(j); } });
route();
})();
</script>

</body>
</html>
