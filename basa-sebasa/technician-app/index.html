<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basa seBasa Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a one-hand phone tool for technicians on site. Single centred column (max 480px), status header, large tap targets, bottom tab bar. High contrast for sunlight. */
:root {
  --bg: #F4F2EC; --card: #FFFFFF; --sunk: #EAE7DF; --ink: #14120D; --muted: #67635A; --line: #DCD8CE;
  --gold: #F0AE00; --gold-deep: #865F00; --on-gold: #14120D;
  --good: #1F7646; --good-bg: #DFF1E5; --bad: #A3271D; --bad-bg: #F8E0DC; --warn-bg: #FCEECC;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #14120D; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.02; margin: 0; text-wrap: balance; }
h2 { font-size: 34px; text-transform: uppercase; }
h3 { font-size: 21px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.demo { background: var(--gold); color: var(--on-gold); font-size: 12.5px; font-weight: 600; text-align: center; padding-block: 5px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.offline { background: #A3271D; color: #fff; font-size: 13.5px; font-weight: 600; text-align: center; padding-block: 6px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* header */
.head { background: #14120D; color: #F5F1E6; padding-block: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.who { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; flex: none; }
.who b { font-size: 18px; display: block; line-height: 1.1; }
.who small { color: #B9B2A2; font-size: 13.5px; }
.level { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: #F0AE00; color: #14120D; padding: 1px 6px; border-radius: 4px; vertical-align: 2px; margin-left: 4px; }
.trust { margin-left: auto; text-align: center; }
.trust b { font-family: var(--display); font-size: 30px; font-weight: 800; color: #F0AE00; line-height: 1; display: block; }
.trust small { font-size: 10.5px; color: #B9B2A2; text-transform: uppercase; letter-spacing: .08em; }
.online { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
.online span b { display: block; font-size: 16px; }
.online span small { color: #B9B2A2; font-size: 13px; }
.switch { position: relative; width: 62px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 17px; background: #4A463D; transition: background .2s; }
.switch i::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #F5F1E6; top: 4px; left: 4px; transition: transform .2s; }
.switch input:checked + i { background: #2FA463; }
.switch input:checked + i::after { transform: translateX(28px); }

main { flex: 1; padding-block: 16px 100px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px solid var(--ink); background: transparent; padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none; text-align: center; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.quiet { border-color: var(--line); font-weight: 600; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 9px 12px; font-size: 15px; border-radius: 11px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform: scale(.98); } .btn { transition: transform .1s; } }

/* job request */
.request { border: 3px solid var(--gold); border-radius: 20px; background: var(--card); padding: 18px; display: grid; gap: 14px; }
.ring { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.count { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }
.earn { background: var(--good-bg); color: var(--good); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.earn b { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--sunk); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.facts b { display: block; font-size: 17px; }
.facts small { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.passport { border-left: 4px solid var(--gold); background: var(--sunk); padding: 10px 12px; border-radius: 0; display: grid; gap: 4px; font-size: 14.5px; }
.passport b { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-deep); }

/* active job */
.stagehead { background: #14120D; color: #F5F1E6; border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.stagehead .muted { color: #B9B2A2; }
.stagehead h2 { color: #F5F1E6; }
.toprow { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sos { background: #A3271D; color: #fff; border: 0; border-radius: 999px; font-weight: 800; font-size: 13px; letter-spacing: .06em; padding: 6px 12px; cursor: pointer; }
.map { border-radius: 14px; overflow: hidden; background: #22201A; aspect-ratio: 16 / 10; max-width: 100%; position: relative; }
.map svg { width: 100%; height: 100%; display: block; }
.eta { position: absolute; left: 10px; top: 10px; background: #F0AE00; color: #14120D; border-radius: 10px; padding: 5px 10px; font-weight: 700; font-size: 14px; }
.loc { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #B9B2A2; }
.dotlive { width: 9px; height: 9px; border-radius: 50%; background: #2FA463; flex: none; }
.dotlive.off { background: #E0A13A; }
@media (prefers-reduced-motion: no-preference) { .dotlive { animation: blink 1.4s ease-in-out infinite; } @keyframes blink { 50% { opacity: .3; } } }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lab { font-weight: 600; font-size: 14.5px; }
input[type=text], input[type=number], textarea, select { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; font-size: 16px; }
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 84px; resize: vertical; }
.code { font-family: var(--mono); font-size: 30px; letter-spacing: .5em; text-align: center; padding-left: .5em; }
.split { width: 100%; border-collapse: collapse; font-size: 15px; }
.split td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.split td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.split tr.you td { font-weight: 800; font-size: 18px; border-bottom: 0; color: var(--good); padding-top: 9px; }
.timer { font-family: var(--display); font-weight: 800; font-size: 60px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.err { color: var(--bad); font-weight: 600; font-size: 14.5px; }
.wait { display: flex; gap: 12px; align-items: center; background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; }
.stagehead .wait { background: rgba(255,255,255,.08); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold-deep); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { border: 2px dashed var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; font-size: 14px; display: grid; gap: 4px; cursor: pointer; position: relative; min-width: 0; overflow-wrap: anywhere; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo.done { border-style: solid; border-color: var(--good); color: var(--good); }
.checklist { display: grid; gap: 8px; }
.tick { display: flex; gap: 10px; align-items: center; font-size: 15.5px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--good); flex: none; }
.tick:has(input:checked) { border-color: var(--good); background: var(--good-bg); }
.report { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; font-size: 14.5px; background: var(--sunk); }
.report header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.report header b { font-family: var(--display); font-size: 19px; text-transform: uppercase; }
.report dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.report dt { color: var(--muted); }
.report dd { margin: 0; overflow-wrap: anywhere; }
.sheet { border: 2px solid var(--bad); }
.stars { display: flex; gap: 4px; }
.stars button { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--line); font-size: 34px; line-height: 1; }
.stars button.on { color: var(--gold); }

/* lists */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi.lead { background: #14120D; color: #F5F1E6; border-color: #14120D; }
.kpi.lead .eyebrow { color: #F0AE00; }
.kpi.lead .small { color: #B9B2A2; }
.goal { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--good); }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row > span:first-child { min-width: 0; }
.row b { display: block; }
.row small { color: var(--muted); font-size: 13px; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.checks { display: grid; gap: 8px; }
.checks div { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.ok { color: var(--good); font-weight: 700; }
.no { color: var(--muted); }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ladder div { border-radius: 10px; padding: 8px 6px; text-align: center; background: var(--sunk); font-size: 12.5px; }
.ladder div b { display: block; font-size: 14px; }
.ladder div.me { background: #14120D; color: #F0AE00; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--sunk); }
.chip.hot { background: var(--bad-bg); color: var(--bad); }
.chip.warm { background: var(--warn-bg); color: var(--gold-deep); }
.empty { text-align: center; padding: 26px 10px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 54px; height: 54px; color: var(--muted); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; font-size: 12.5px; font-weight: 600; position: relative; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 6px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 16px; font-weight: 600; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }
</style>

<div class="shell">
  <div class="demo" id="demo">Preview: sample jobs and payments. Nothing real is sent.</div>
  <div class="offline" id="offline" hidden>No network. Your updates are saved and will send when you're back.</div>
  <header class="head">
    <div class="who"><span class="avatar">TM</span><span><b>Tendai M. <span class="level">Gold</span></b><small>Fridge &amp; aircon · Avondale · Verified</small></span><span class="trust"><b>94</b><small>Trust</small></span></div>
    <label class="online" for="online"><span><b id="on-label">You're offline</b><small id="on-sub">Go online to receive jobs near you.</small></span><span class="switch"><input type="checkbox" id="online" aria-label="Available for jobs"><i></i></span></label>
  </header>
  <main id="app"></main>
</div>
<div class="tabs"><nav aria-label="App">
  <a href="#jobs" data-tab="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Jobs<span class="dot" id="jobs-dot" hidden></span></a>
  <a href="#earnings" data-tab="earnings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Earnings</a>
  <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>Profile</a>
</nav></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ================= CONFIG (same rules as the ops desk) =================
const P = { commission: 15, callout: 9, calloutPlatform: 1, freeKm: 10, perKm: 0.5, payoutHours: 24, acceptSeconds: 60, diagnosisDays: 30, noShowMinutes: 15, weeklyGoal: 250 };
const DEMO = true; const SPEED = 1;
const ME = { name: "Tendai M.", suburb: "Avondale", trust: 94, rating: 4.9, jobs: 128, years: 7, level: "Gold",
  checks: { "National ID": true, "Trade qualification": true, "References": true, "Offers warranty": true, "Admin inspected": true, "Police clearance": false },
  skills: ["Inverter fridges", "Split aircons", "Cold rooms", "R600a / R290 gas"], languages: ["English", "Shona"], hours: "Mon–Sat, 7am–6pm" };
const LEVELS = [
  { name: "Bronze", need: "New, verified", perk: "Standard jobs" },
  { name: "Silver", need: "25 jobs, 4.6★", perk: "Shown higher in matches" },
  { name: "Gold", need: "100 jobs, 4.8★, 0 open complaints", perk: "First pick on jobs + Gold badge" },
  { name: "Master", need: "300 jobs, 4.9★, trains others", perk: "Commercial contracts + training fees" },
];
// Trade quality checklist (this is the HVAC/refrigeration one; each trade gets its own)
const CHECKLIST = ["Isolated power before work", "Leak test done after repair", "Pressures and amps within spec", "Unit cooling at handover", "Work area cleaned", "Showed the customer the result"];
// Sample requests the preview sends. In the live app these come from the Basa seBasa server.
const SAMPLES = [
  { type: "Repair", item: "Fridge not cooling", desc: "Samsung double-door fridge stopped cooling on Sunday. Light comes on, motor clicks.", customer: "Chipo N.", custRating: 4.8, custJobs: 3, regular: true, suburb: "Mabelreign", address: "22 Harare Dr, near the shops", km: 5.5,
    passport: { appliance: "Samsung RT38 fridge", history: [["Mar 2026", "Regassed R600a, replaced thermostat", "Tendai M."]] } },
  { type: "Installation", item: "Split aircon installation", desc: "New 12,000 BTU split unit, bedroom on first floor. Unit already bought.", customer: "Farai D.", custRating: 5, custJobs: 1, suburb: "Mount Pleasant", address: "7 Pendennis Rd", km: 4, agreed: 120, scheduled: "Sat 9:00" },
  { type: "Repair", item: "Chest freezer tripping power", desc: "Freezer trips the breaker every time it starts. Small shop, urgent.", customer: "Ruvimbo K.", custRating: 4.6, custJobs: 7, suburb: "Mbare", address: "Mbare Musika, stall 14", km: 13, urgent: true,
    passport: { appliance: "Defy 300L chest freezer", history: [["Jan 2026", "Replaced fan motor", "Kudzai C."], ["Aug 2025", "Cleaned condenser", "Kudzai C."]] } },
  { type: "Service", item: "Aircon service (2 units)", desc: "Two wall-mounted units need a full service and gas check.", customer: "Tafadzwa B.", custRating: 4.9, custJobs: 5, regular: true, suburb: "Borrowdale", address: "41 Borrowdale Rd", km: 8, agreed: 60 },
];

// ================= STATE =================
const S = { online: false, net: true, queued: 0, request: null, job: null, done: [], tab: "jobs", sampleIx: 0, sos: false, timers: [] };
try { const saved = JSON.parse(localStorage.getItem("bsb-pro2") || "null"); if (saved && Array.isArray(saved.done)) S.done = saved.done; } catch (e) {}
const persist = () => { try { localStorage.setItem("bsb-pro2", JSON.stringify({ done: S.done.slice(0, 30) })); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const usd = (n) => "$" + r2(n).toFixed(2);
const later = (ms, fn) => { const t = setTimeout(fn, ms / SPEED); S.timers.push(t); return t; };
const first = (n) => String(n).split(" ")[0];
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3400); }
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

// every update goes through here: sent now, or queued until the network is back (power cuts, no signal)
function send(text) { if (S.net) { if (text) toast(text); } else { S.queued++; toast("Saved offline. It will send when you're connected."); } }

// ================= MONEY: what the technician earns =================
function earnings(j) {
  const travel = r2(Math.max(0, j.km - P.freeKm) * P.perKm);
  const callout = j.type === "Repair" ? P.callout - P.calloutPlatform : 0;
  const labour = j.calloutOnly ? 0 : j.type === "Repair" ? r2(j.quote?.labour || 0) : r2(j.agreed || 0);
  const parts = j.calloutOnly ? 0 : j.type === "Repair" ? r2(j.quote?.parts || 0) : 0;
  const fee = r2(labour * P.commission / 100);
  return { travel, callout, labour, parts, fee, total: r2(callout + travel + labour - fee + parts), upfront: r2(callout + travel) };
}

// ================= SIMULATED SERVER =================
function scheduleRequest(delay = 4000) { later(delay, () => { if (!S.online || S.request || S.job) return; const s = SAMPLES[S.sampleIx++ % SAMPLES.length]; S.request = { ...s, id: "BSB-" + (1100 + S.sampleIx), code: String(1000 + Math.floor(Math.random() * 9000)), at: Date.now(), expires: Date.now() + P.acceptSeconds * 1000 }; try { navigator.vibrate?.([200, 100, 200]); } catch (e) {} render(); }); }
function sim(stage, ms, text, guard) { later(ms, () => { const j = S.job; if (!j || (guard && j.stage !== guard)) return; j.stage = stage; if (text) toast(text); render(); }); }

    <div class="card"><div class="goal" aria-hidden="true"><i style="width:${Math.min(100, got / P.weeklyGoal * 100)}%"></i></div><p class="muted small">${got >= P.weeklyGoal ? "Weekly goal reached. Well done." : usd(P.weeklyGoal - got) + " to reach your weekly goal."}</p></div>
    <div class="card"><h3>Payouts</h3>${S.done.length ? S.done.map((d) => { const left = d.at + P.payoutHours * 36e5 - now; return `<div class="row"><span><b>${esc(d.item)}</b><small>${new Date(d.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · ${esc(d.id)}</small></span><span class="amt">${usd(d.earned)}<br><span class="pill ${left <= 0 ? "good" : ""}">${left <= 0 ? "Paid to EcoCash" : "Due in " + Math.max(1, Math.round(left / 36e5)) + " h"}</span></span></div>`; }).join("") : `<p class="muted">Your completed jobs and payouts appear here.</p>`}</div>
    <div class="card"><h3>Your regulars</h3><p><b style="font-family:var(--display);font-size:28px">${regulars + 14}</b> <span class="muted">customers have booked you again</span></p><p class="muted small">When your regulars book you through Basa seBasa, you get the job first, their warranty stays valid, and every visit grows your Trust Score. Jobs taken outside the app lose all three.</p></div>
    <div class="card"><h3>How you're paid</h3><p class="muted">Customers pay Basa seBasa on EcoCash. We send your share to your EcoCash within ${P.payoutHours} hours: ${100 - P.commission}% of labour, all of the parts, $${P.callout - P.calloutPlatform} of each $${P.callout} call-out, and any extra travel.</p></div>`;
}
function viewHistory() {
  return `<h2>History</h2><div class="card">${S.done.length ? S.done.map((d) => `<div class="row"><span><b>${esc(d.item)}</b><small>${esc(d.suburb)} · ${esc(d.type)} · ${d.minutes ? d.minutes + " min on the job" : d.noshow ? "customer not home" : "call-out only"}${d.warranty ? " · warranty to " + esc(d.warranty) : ""}</small></span><span class="amt">${d.rating ? "★".repeat(d.rating) : "—"}<br><small>${usd(d.earned)}</small></span></div>`).join("") : `<div class="empty"><h3>No jobs yet</h3><p class="muted">Go online to get your first job.</p></div>`}</div>`;
}
function viewProfile() {
  const ix = LEVELS.findIndex((l) => l.name === ME.level);
  return `<h2>Profile</h2>
    <div class="card"><div class="toprow"><span><span class="eyebrow">Trust Score</span><b style="display:block;font-family:var(--display);font-size:54px;line-height:1">${ME.trust}<span class="muted" style="font-size:22px">/100</span></b></span><span class="pill good">Verified</span></div><p class="muted">Customers see this before they choose you. It comes from your checks, experience, ratings, on-time arrivals and complaint record.</p></div>
    <div class="card"><h3>Pro level: ${esc(ME.level)}</h3><div class="ladder">${LEVELS.map((l, i) => `<div class="${i === ix ? "me" : ""}"><b>${l.name}</b>${i < ix ? "✓" : i === ix ? "You" : ""}</div>`).join("")}</div>
      <p><b>Your perk:</b> ${esc(LEVELS[ix].perk)}.</p><p class="muted small">Next: <b>${esc(LEVELS[ix + 1]?.name || "")}</b> at ${esc(LEVELS[ix + 1]?.need || "")}. Perk: ${esc(LEVELS[ix + 1]?.perk || "")}.</p></div>
    <div class="card"><h3>Checks</h3><div class="checks">${Object.entries(ME.checks).map(([k, v]) => `<div><span>${esc(k)}</span><span class="${v ? "ok" : "no"}">${v ? "✓ Checked" : "Not yet · +10"}</span></div>`).join("")}</div></div>
    <div class="card"><h3>Skills</h3><div class="chips">${ME.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div><p class="muted small">Skills verified by Basa seBasa get you matched to the jobs you do best.</p></div>
    <div class="card"><h3>Your details</h3><div class="checks"><div><span>Based in</span><span>${esc(ME.suburb)}</span></div><div><span>Experience</span><span>${ME.years} years</span></div><div><span>Working hours</span><span>${esc(ME.hours)}</span></div><div><span>Languages</span><span>${esc(ME.languages.join(", "))}</span></div><div><span>EcoCash for payouts</span><span class="mono">077 ••• 0001</span></div></div></div>
    ${DEMO ? `<div class="card"><h3>Preview controls</h3><p class="muted small">Try what happens during a power cut or with no signal.</p><button class="btn quiet" type="button" data-net>${S.net ? "Simulate no network" : "Reconnect network"}</button></div>` : ""}`;
}

// ================= LIVE BITS =================
let raf = 0;
function startMap() {
  cancelAnimationFrame(raf);
  const j = S.job, route = document.getElementById("route"), dot = document.getElementById("dot"); if (!route) return;
  const len = route.getTotalLength(), dur = 25000 / SPEED, eta0 = Math.round(8 + j.km * 2.4);
  const tick = () => {
    if (!document.getElementById("route") || S.job?.stage !== "travelling") return;
    const f = Math.min(1, (Date.now() - j.tripAt) / dur); const pt = route.getPointAtLength(len * f);
    dot.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
    const eta = document.getElementById("eta"); if (eta) eta.textContent = f >= 1 ? "You're here" : `${Math.max(1, Math.round(eta0 * (1 - f)))} min · ${r2(j.km * (1 - f)).toFixed(1)} km`;
    if (f < 1) raf = requestAnimationFrame(tick);
  };
  tick();
}
setInterval(() => {
  if (S.request && S.tab === "jobs") {
    const left = Math.max(0, Math.ceil((S.request.expires - Date.now()) / 1000));
    const c = $("#count"), b = $("#bar"); if (c) c.textContent = left + "s"; if (b) b.style.width = (left / P.acceptSeconds) * 100 + "%";
    if (left <= 0) { S.request = null; toast("Request expired. It went to the next pro."); render(); scheduleRequest(6000); }
  }
  const j = S.job;
  if (j?.stage === "working") { const t = $("#timer"); if (t) t.textContent = fmt(workMs(j)); }
  if (j?.stage === "verify" && j.waitStart) { const w = $("#wait"); const left = waitLeft(j); if (w) w.textContent = fmt(left); if (left <= 0 && !j.waitDone) { j.waitDone = true; render(); } }
}, 1000);

// ================= ACTIONS =================
function finishJob(earned, extra = {}) { const j = S.job; S.done.unshift({ id: j.id, item: j.item, type: j.type, suburb: j.suburb, customer: j.customer, regular: !!j.regular, at: Date.now(), earned, minutes: j.minutes || 0, rating: j.rating || 0, warranty: j.warranty && !j.calloutOnly ? dateIn(j.warranty) : "", ...extra }); persist(); S.job = null; S.sos = false; render(); if (S.online) scheduleRequest(5000); }
const fail = (id, msg) => { const el = document.getElementById(id); el.textContent = msg; el.hidden = false; };
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "online") { S.online = e.target.checked; if (!S.online) { S.request = null; toast("You're offline. No new jobs."); } else { toast("You're online. Location sharing is on."); scheduleRequest(); } render(); }
  if (["before-photo", "after-photo", "receipt-photo"].includes(id)) { const f = e.target.files?.[0]; if (f && S.job) { S.job[{ "before-photo": "beforePhoto", "after-photo": "afterPhoto", "receipt-photo": "receiptPhoto" }[id]] = f.name; render(); } }
});
document.addEventListener("input", (e) => {
  if ((e.target.id === "labour" || e.target.id === "parts") && S.job) { const prev = $("#preview"); if (prev) prev.innerHTML = splitTable({ ...S.job, quote: { labour: Number($("#labour").value) || 0, parts: Number($("#parts").value) || 0 } }); }
  if (e.target.id === "code") e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const j = S.job; const has = (a) => b.hasAttribute(a);
  if (has("data-go-online")) { S.online = true; toast("You're online. Location sharing is on."); scheduleRequest(); render(); }
  else if (has("data-decline")) { S.request = null; toast("Declined. We'll send the next job."); render(); scheduleRequest(7000); }
  else if (has("data-accept")) {
    const r = S.request; S.request = null; S.job = { ...r, stage: r.type === "Repair" ? "await_callout" : "ready", acceptedAt: Date.now() }; render();
    send(`Accepted. ${first(r.customer)} has been told and given a Basa Code.`);
    if (r.type === "Repair") sim("ready", 5000, "Call-out paid. You can leave now.", "await_callout");
  }
  else if (has("data-trip")) { j.stage = "travelling"; j.tripAt = Date.now(); send(`${first(j.customer)} can see you on the map.`); render(); }
  else if (has("data-arrived")) { j.stage = "verify"; render(); }
  else if (has("data-verify")) { const c = $("#code").value; if (c.length !== 4) return fail("code-err", "Enter the 4-digit code."); if (c !== j.code) return fail("code-err", "That code doesn't match. Check you're at the right house, or call us."); j.stage = "arrived"; j.arrivedAt = Date.now(); send("Arrival confirmed. The customer knows it's really you."); render(); }
  else if (has("data-wait")) { j.waitStart = Date.now(); send(`${first(j.customer)} has been told you're waiting outside.`); render(); }
  else if (has("data-noshow")) { j.calloutOnly = true; j.noshow = true; send("Job closed as customer not home."); finishJob(j.type === "Repair" ? earnings(j).upfront : 3, { noshow: true }); }
  else if (has("data-quote")) {
    const diag = $("#diag").value.trim(), lab = Number($("#labour").value), parts = Number($("#parts").value) || 0;
    if (diag.length < 5) return fail("q-err", "Describe what's wrong so the customer understands.");
    if (!(lab > 0)) return fail("q-err", "Enter the labour price.");
    j.quote = { labour: lab, parts, diagnosis: diag }; j.warranty = Number($("#warranty").value); j.stage = "quote_sent"; send(""); render();
    if (lab + parts > 150) sim("deferred", 6000, "The customer will repair later. You keep the call-out.", "quote_sent");
    else sim("approved", 6000, "Quote approved. You can start.", "quote_sent");
  }
  else if (has("data-start")) { if ($("#warranty")) j.warranty = Number($("#warranty").value); j.warranty = j.warranty || 90; j.stage = "working"; j.startedAt = Date.now(); j.pausedTotal = 0; j.pausedAt = null; send("Job timer started."); render(); }
  else if (has("data-pause")) { if (j.pausedAt) { j.pausedTotal += Date.now() - j.pausedAt; j.pausedAt = null; } else j.pausedAt = Date.now(); render(); }
  else if (has("data-complete")) {
    const checks = CHECKLIST.filter((_, i) => $("#ck" + i).checked).length;
    if (checks < CHECKLIST.length) return fail("done-err", `Tick all ${CHECKLIST.length} quality checks first.`);
    if (!j.afterPhoto) return fail("done-err", "Add an after photo. It protects you if there's a dispute.");
    if (earnings(j).parts > 0 && !j.receiptPhoto) return fail("done-err", "Add a photo of the parts receipt so the customer sees what they paid for.");
    Object.assign(j, { checks, psi: $("#psi").value, amps: $("#amps").value, notes: $("#notes").value.trim(), minutes: Math.max(1, Math.round(workMs(j) / 6e4)), stage: "await_payment" });
    send("Service report sent to the customer."); render();
    later(7000, () => { if (S.job !== j) return; j.stage = "rate"; j.rating = 5; j.review = "On time, showed his Basa Code, and explained everything."; toast("Customer paid. Your payout is on its way."); render(); });
  }
  else if (b.dataset.crate) { j.custStars = Number(b.dataset.crate); render(); }
  else if (has("data-finish")) { if (!j.custStars) return fail("rate-err", "Tap the stars to rate the customer."); if ($("#flag").checked) toast("Thanks. Our team will call you about this."); finishJob(earnings(j).total); }
  else if (has("data-end-deferred")) { j.calloutOnly = true; finishJob(earnings(j).upfront); }
  else if (has("data-sos")) { S.sos = !S.sos; render(); }
  else if (has("data-sos-call")) toast("In the live app this calls the Basa seBasa safety line with your location.");
  else if (has("data-sos-share")) toast("In the live app this sends your live location to your emergency contact.");
  else if (has("data-sos-leave")) { toast("Our team has been told and will contact the customer. Get somewhere safe."); S.sos = false; j.calloutOnly = true; finishJob(earnings(j).upfront, { noshow: false }); }
  else if (has("data-chat")) toast("In the live app this opens WhatsApp with the customer through a Basa seBasa number.");
  else if (has("data-net")) { S.net = !S.net; if (S.net && S.queued) { toast(`Back online. ${S.queued} saved update${S.queued > 1 ? "s" : ""} sent.`); S.queued = 0; } else if (!S.net) toast("No network. Keep working; updates are saved."); render(); }
});
function route() { const h = location.hash.slice(1); S.tab = ["jobs", "earnings", "history", "profile"].includes(h) ? h : "jobs"; S.sos = false; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
route();
})();
</script>

</body>
</html>
