<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basa seBasa Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a one-hand phone tool for technicians on site. Single centred column (max 480px), status header, large tap targets, bottom tab bar. High contrast for sunlight. */
:root {
  --bg: #F4F2EC; --card: #FFFFFF; --sunk: #EAE7DF; --ink: #14120D; --muted: #67635A; --line: #DCD8CE;
  --gold: #F0AE00; --gold-deep: #865F00; --on-gold: #14120D; --night: #14120D; --night-fg: #F5F1E6;
  --good: #1F7646; --good-bg: #DFF1E5; --bad: #A3271D; --bad-bg: #F8E0DC; --warn-bg: #FCEECC;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542; --night: #0A0907; --night-fg: #F5F1E6;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0E0A; --card: #1A1813; --sunk: #24211A; --ink: #F3EFE5; --muted: #A8A294; --line: #35312A;
  --gold: #F5BA14; --gold-deep: #F5C542; --night: #0A0907; --night-fg: #F5F1E6;
  --good: #66C88F; --good-bg: #16301E; --bad: #F18A80; --bad-bg: #3B1C19; --warn-bg: #3A2C10;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #14120D; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.02; margin: 0; text-wrap: balance; }
h2 { font-size: 34px; text-transform: uppercase; }
h3 { font-size: 21px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.demo { background: var(--gold); color: var(--on-gold); font-size: 12.5px; font-weight: 600; text-align: center; padding-block: 5px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* header */
.head { background: #14120D; color: #F5F1E6; padding-block: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.who { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: #F0AE00; color: #14120D; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; flex: none; }
.who b { font-size: 18px; display: block; line-height: 1.1; }
.who small { color: #B9B2A2; font-size: 13.5px; }
.trust { margin-left: auto; text-align: center; }
.trust b { font-family: var(--display); font-size: 30px; font-weight: 800; color: #F0AE00; line-height: 1; display: block; }
.trust small { font-size: 10.5px; color: #B9B2A2; text-transform: uppercase; letter-spacing: .08em; }
.online { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
.online span b { display: block; font-size: 16px; }
.online span small { color: #B9B2A2; font-size: 13px; }
.switch { position: relative; width: 62px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 17px; background: #4A463D; transition: background .2s; }
.switch i::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #F5F1E6; top: 4px; left: 4px; transition: transform .2s; }
.switch input:checked + i { background: #2FA463; }
.switch input:checked + i::after { transform: translateX(28px); }

main { flex: 1; padding-block: 16px 100px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px solid var(--ink); background: transparent; padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.quiet { border-color: var(--line); font-weight: 600; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .btn:active { transform: scale(.98); } .btn { transition: transform .1s; } }

/* job request */
.request { border: 3px solid var(--gold); border-radius: 20px; background: var(--card); padding: 18px; display: grid; gap: 14px; }
.ring { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.count { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }
.earn { background: var(--good-bg); color: var(--good); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.earn b { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--sunk); border-radius: 12px; padding: 9px 10px; }
.facts b { display: block; font-size: 17px; }
.facts small { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }

/* active job */
.stagehead { background: #14120D; color: #F5F1E6; border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.stagehead .muted { color: #B9B2A2; }
.stagehead h2 { color: #F5F1E6; }
.map { border-radius: 14px; overflow: hidden; background: #22201A; aspect-ratio: 16 / 10; max-width: 100%; position: relative; }
.map svg { width: 100%; height: 100%; display: block; }
.eta { position: absolute; left: 10px; top: 10px; background: #F0AE00; color: #14120D; border-radius: 10px; padding: 5px 10px; font-weight: 700; font-size: 14px; }
.loc { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #B9B2A2; }
.dotlive { width: 9px; height: 9px; border-radius: 50%; background: #2FA463; flex: none; }
@media (prefers-reduced-motion: no-preference) { .dotlive { animation: blink 1.4s ease-in-out infinite; } @keyframes blink { 50% { opacity: .3; } } }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 14.5px; }
input[type=text], input[type=number], textarea, select { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; font-size: 16px; }
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 90px; resize: vertical; }
.split { width: 100%; border-collapse: collapse; font-size: 15px; }
.split td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.split td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.split tr.you td { font-weight: 800; font-size: 18px; border-bottom: 0; color: var(--good); padding-top: 9px; }
.timer { font-family: var(--display); font-weight: 800; font-size: 64px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.err { color: var(--bad); font-weight: 600; font-size: 14.5px; }
.wait { display: flex; gap: 12px; align-items: center; background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold-deep); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { border: 2px dashed var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; font-size: 14px; display: grid; gap: 4px; cursor: pointer; position: relative; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo.done { border-style: solid; border-color: var(--good); color: var(--good); }

/* lists */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi.lead { background: #14120D; color: #F5F1E6; border-color: #14120D; }
.kpi.lead .eyebrow { color: #F0AE00; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row b { display: block; }
.row small { color: var(--muted); font-size: 13px; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.checks { display: grid; gap: 8px; }
.checks div { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.ok { color: var(--good); font-weight: 700; }
.no { color: var(--muted); }
.empty { text-align: center; padding: 30px 10px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 54px; height: 54px; color: var(--muted); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; font-size: 12.5px; font-weight: 600; position: relative; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 6px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 16px; font-weight: 600; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }
</style>

<div class="shell">
  <div class="demo" id="demo">Preview: sample jobs and payments. Nothing real is sent.</div>
  <header class="head">
    <div class="who"><span class="avatar">TM</span><span><b>Tendai M.</b><small>Fridge &amp; aircon · Avondale · Verified</small></span><span class="trust"><b id="trust">94</b><small>Trust</small></span></div>
    <label class="online" for="online"><span><b id="on-label">You're offline</b><small id="on-sub">Go online to receive jobs near you.</small></span><span class="switch"><input type="checkbox" id="online" aria-label="Available for jobs"><i></i></span></label>
  </header>
  <main id="app"></main>
</div>
<div class="tabs"><nav aria-label="App">
  <a href="#jobs" data-tab="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Jobs<span class="dot" id="jobs-dot" hidden></span></a>
  <a href="#earnings" data-tab="earnings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Earnings</a>
  <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>Profile</a>
</nav></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ================= CONFIG (same rules as the ops desk) =================
const P = { commission: 15, callout: 9, calloutPlatform: 1, freeKm: 10, perKm: 0.5, payoutHours: 24, acceptSeconds: 60, diagnosisDays: 30 };
const DEMO = true; const SPEED = 1;
const ME = { name: "Tendai M.", trade: "HVAC/Refrigeration", suburb: "Avondale", trust: 94, rating: 4.9, jobs: 128, years: 7,
  checks: { "National ID": true, "Trade qualification": true, "References": true, "Offers warranty": true, "Admin inspected": true, "Police clearance": false } };
// Sample requests the preview sends. In the live app these come from the Basa seBasa server.
const SAMPLES = [
  { type: "Repair", item: "Fridge not cooling", desc: "Samsung double-door fridge stopped cooling on Sunday. Light comes on, motor clicks.", customer: "Chipo N.", suburb: "Mabelreign", address: "22 Harare Dr, near the shops", km: 5.5 },
  { type: "Installation", item: "Split aircon installation", desc: "New 12,000 BTU split unit, bedroom on first floor. Unit already bought.", customer: "Farai D.", suburb: "Mount Pleasant", address: "7 Pendennis Rd", km: 4, agreed: 120 },
  { type: "Repair", item: "Chest freezer tripping power", desc: "Freezer trips the breaker every time it starts. Small shop, urgent.", customer: "Ruvimbo K.", suburb: "Mbare", address: "Mbare Musika, stall 14", km: 13, urgent: true },
  { type: "Service", item: "Aircon service", desc: "Two wall-mounted units need a full service and gas check.", customer: "Tafadzwa B.", suburb: "Borrowdale", address: "41 Borrowdale Rd", km: 8, agreed: 60 },
];

// ================= STATE =================
const S = { online: false, request: null, job: null, done: [], tab: "jobs", sampleIx: 0, timers: [] };
try { const saved = JSON.parse(localStorage.getItem("bsb-pro") || "null"); if (saved && Array.isArray(saved.done)) S.done = saved.done; } catch (e) {}
const persist = () => { try { localStorage.setItem("bsb-pro", JSON.stringify({ done: S.done.slice(0, 30) })); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const usd = (n) => "$" + r2(n).toFixed(2);
const later = (ms, fn) => { const t = setTimeout(fn, ms / SPEED); S.timers.push(t); return t; };
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }
const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

// ================= MONEY: what the technician earns =================
function earnings(j) {
  const travel = r2(Math.max(0, j.km - P.freeKm) * P.perKm);
  const callout = j.type === "Repair" ? P.callout - P.calloutPlatform : 0;
  const labour = j.type === "Repair" ? r2(j.quote?.labour || 0) : r2(j.agreed || 0);
  const parts = j.type === "Repair" ? r2(j.quote?.parts || 0) : 0;
  const fee = r2(labour * P.commission / 100);
  return { travel, callout, labour, parts, fee, total: r2(callout + travel + labour - fee + parts), upfront: r2(callout + travel) };
}

// ================= SIMULATED SERVER =================
function scheduleRequest(delay = 4000) { later(delay, () => { if (!S.online || S.request || S.job) return; const s = SAMPLES[S.sampleIx++ % SAMPLES.length]; S.request = { ...s, id: "BSB-" + (1100 + S.sampleIx), at: Date.now(), expires: Date.now() + P.acceptSeconds * 1000 }; buzz(); render(); }); }
function buzz() { try { navigator.vibrate?.([200, 100, 200]); } catch (e) {} }
function sim(stage, ms, text) { later(ms, () => { if (!S.job) return; S.job.stage = stage; if (text) toast(text); render(); }); }

// ================= RENDER =================
function render() {
  $("#demo").hidden = !DEMO;
  $("#on-label").textContent = S.online ? "You're online" : "You're offline";
  $("#on-sub").textContent = S.job ? "On a job. New requests are paused." : S.online ? "Waiting for jobs near " + ME.suburb + "." : "Go online to receive jobs near you.";
  $("#online").checked = S.online;
  $("#jobs-dot").hidden = !(S.tab !== "jobs" && (S.request || S.job));
  document.querySelectorAll("[data-tab]").forEach((a) => a.dataset.tab === S.tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const keep = {}; document.querySelectorAll("#app input[id], #app textarea[id]").forEach((el) => { if (el.type !== "file") keep[el.id] = el.value; });
  $("#app").innerHTML = S.tab === "earnings" ? viewEarnings() : S.tab === "history" ? viewHistory() : S.tab === "profile" ? viewProfile() : viewJobs();
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });
  if (S.job?.stage === "travelling") startMap();
}

function viewJobs() {
  if (S.request) return requestCard(S.request);
  if (S.job) return jobView(S.job);
  if (!S.online) return `<div class="card empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M18.4 5.6a9 9 0 1 1-12.8 0M12 2v10"/></svg><h3>Go online to start</h3><p class="muted">Flip the switch at the top when you're ready to take jobs. You must share your location while you're on a job.</p><button class="btn gold" type="button" data-go-online>Go online</button></div>${todayStrip()}`;
  return `<div class="card empty"><div class="spin" aria-hidden="true" style="width:40px;height:40px"></div><h3>Looking for jobs</h3><p class="muted">We send you jobs from customers near ${esc(ME.suburb)} that match your trade. You'll have ${P.acceptSeconds} seconds to accept each one.</p></div>${todayStrip()}`;
}
function todayStrip() {
  const today = S.done.filter((d) => new Date(d.at).toDateString() === new Date().toDateString());
  return `<div class="kpis"><div class="kpi lead"><span class="eyebrow">Today</span><b>${usd(today.reduce((s, d) => s + d.earned, 0))}</b><span style="color:#B9B2A2;font-size:13.5px">${today.length} job${today.length === 1 ? "" : "s"}</span></div><div class="kpi"><span class="eyebrow">Rating</span><b>${ME.rating}</b><span class="muted" style="font-size:13.5px">${ME.jobs + S.done.length} jobs done</span></div></div>`;
}

function requestCard(r) {
  const e = earnings(r); const left = Math.max(0, Math.ceil((r.expires - Date.now()) / 1000));
  const eta = Math.round(8 + r.km * 2.4);
  return `<div class="request" role="alertdialog" aria-label="New job request">
    <div class="ring"><span class="eyebrow">New job${r.urgent ? " · Urgent" : ""}</span><span class="count" id="count">${left}s</span></div>
    <div class="bar" aria-hidden="true"><i id="bar" style="width:${(left / P.acceptSeconds) * 100}%"></i></div>
    <div><h2>${esc(r.item)}</h2><p class="muted" style="margin-top:6px">${esc(r.type)} · ${esc(r.suburb)}</p></div>
    <div class="facts"><div><b>${r.km} km</b><small>away</small></div><div><b>~${eta} min</b><small>to get there</small></div><div><b>${esc(r.customer.split(" ")[0])}</b><small>customer</small></div></div>
    <p>${esc(r.desc)}</p>
    ${r.type === "Repair" ? `<div class="earn"><span><strong>You earn now</strong><br><small style="color:inherit;opacity:.85">Call-out${e.travel ? " + extra travel" : ""}. Repair quoted on site.</small></span><b>${usd(e.upfront)}</b></div>`
      : `<div class="earn"><span><strong>You earn</strong><br><small style="color:inherit;opacity:.85">${usd(e.labour)} agreed price, minus ${P.commission}%${e.travel ? ", plus travel" : ""}</small></span><b>${usd(e.total)}</b></div>`}
    <div class="two"><button class="btn quiet" type="button" data-decline>Decline</button><button class="btn gold" type="button" data-accept>Accept job</button></div>
    <p class="muted" style="font-size:13.5px;text-align:center">Not answering counts as a decline. The job goes to the next pro.</p></div>`;
}

function jobView(j) {
  const e = earnings(j); const first = j.customer.split(" ")[0];
  const head = (title, sub, extra = "") => `<div class="stagehead"><div style="display:flex;justify-content:space-between;gap:10px"><span class="mono" style="color:#B9B2A2">${esc(j.id)} · ${esc(j.type)}</span><span class="loc"><span class="dotlive"></span>Location shared</span></div><h2>${esc(title)}</h2>${sub ? `<p class="muted">${sub}</p>` : ""}${extra}</div>`;
  const cust = `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><span><span class="eyebrow">Customer</span><b style="display:block;font-size:18px">${esc(j.customer)}</b><span class="muted">${esc(j.address)}, ${esc(j.suburb)}</span></span><span class="pill">${j.km} km</span></div><p>${esc(j.desc)}</p>
    <div class="two"><a class="btn quiet" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.address + ", " + j.suburb + ", Harare")}" target="_blank" rel="noopener">Directions</a><button class="btn quiet" type="button" data-chat>Message</button></div></div>`;
  switch (j.stage) {
    case "await_callout": return head("Waiting for call-out", `${esc(first)} is paying the ${usd(P.callout + e.travel)} call-out on EcoCash. Don't leave yet.`, `<div class="wait" style="background:rgba(255,255,255,.08)"><span class="spin"></span><span>We'll tell you the moment it's paid.</span></div>`) + cust;
    case "ready": return head("Ready to go", j.type === "Repair" ? "Call-out paid. You're cleared to travel." : `Price confirmed with ${esc(first)}. You're cleared to travel.`) + `<div class="card"><h3>Start your trip</h3><p class="muted">The customer will see you on the map with your ETA. Keep the app open while you travel.</p><button class="btn gold" type="button" data-trip>I'm on my way</button></div>` + cust;
    case "travelling": return head(`On the way to ${first}`, "", `<div class="map"><svg viewBox="0 0 320 200" aria-label="Your route"><rect width="320" height="200" fill="#22201A"/><g stroke="#3A362C" stroke-width="8" fill="none" stroke-linecap="round"><path d="M-10 50H330M-10 140H330M70 -10V210M200 -10V210M270 -10V210"/></g><g stroke="#2E2B23" stroke-width="3" fill="none"><path d="M-10 95H330M130 -10V210M-10 180H330M30 0V200"/></g><path id="route" d="M40 170 L70 170 L70 140 L200 140 L200 50 L272 50" stroke="#F0AE00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/><g transform="translate(272 50)"><circle r="11" fill="#F5F1E6"/><path d="M-5 2 0 -4 5 2V6H-5z" fill="#14120D"/></g><g id="dot"><circle r="13" fill="#F0AE00" opacity=".25"/><circle r="7" fill="#F0AE00" stroke="#14120D" stroke-width="2"/></g></svg><span class="eta" id="eta">${Math.round(8 + j.km * 2.4)} min</span></div>`) + `<button class="btn gold" type="button" data-arrived id="arrive-btn">I've arrived</button>` + cust;
    case "arrived": return head("You've arrived", j.type === "Repair" ? `Inspect the problem, then send ${esc(first)} a full quote before doing any work.` : `Take a before photo, then start the job timer.`) + (j.type === "Repair" ? quoteForm(j) : startCard(j));
    case "quote_sent": return head("Quote sent", `Waiting for ${esc(first)} to approve.`, `<div class="wait" style="background:rgba(255,255,255,.08)"><span class="spin"></span><span>${esc(first)} sees your diagnosis and the total on WhatsApp.</span></div>`) + `<div class="card"><h3>Your quote</h3>${splitTable(j)}</div>`;
    case "deferred": return head("Repair saved for later", `${esc(first)} will repair another time. You keep the call-out.`) + `<div class="card"><p>The diagnosis is valid for ${P.diagnosisDays} days. When ${esc(first)} is ready, <b>you get first chance</b> to do the repair. You'll have 24 hours to accept.</p><table class="split"><tr class="you"><td>You earned</td><td>${usd(e.upfront)}</td></tr></table><p class="muted" style="font-size:14px">Paid to your EcoCash within ${P.payoutHours} hours.</p><button class="btn gold" type="button" data-finish-deferred>Back to jobs</button></div>`;
    case "approved": return head("Quote approved", `${esc(first)} said yes. You can start.`) + startCard(j);
    case "working": return head("Job in progress", "") + `<div class="card"><span class="eyebrow" style="text-align:center">Time on the job</span><div class="timer" id="timer">${fmt(workMs(j))}</div><div class="two"><button class="btn quiet" type="button" data-pause>${j.pausedAt ? "Resume" : "Pause"}</button><button class="btn quiet" type="button" data-chat>Message</button></div></div>
      <div class="card"><h3>Finish the job</h3><div class="photos"><label class="photo ${j.beforePhoto ? "done" : ""}">${j.beforePhoto ? "✓ Before photo" : "Before photo"}<small class="muted">${j.beforePhoto ? esc(j.beforePhoto) : "Taken"}</small></label><label class="photo ${j.afterPhoto ? "done" : ""}"><input type="file" accept="image/*" capture="environment" id="after-photo">${j.afterPhoto ? "✓ After photo" : "Add after photo"}<small class="muted">${j.afterPhoto ? esc(j.afterPhoto) : "Required"}</small></label></div>
      <div class="field"><label for="notes">What did you do?</label><textarea id="notes" placeholder="e.g. Replaced start relay, regassed, tested 30 min. 3-month warranty."></textarea></div><p class="err" id="done-err" hidden></p><button class="btn gold" type="button" data-complete>Job complete</button></div>`;
    case "await_payment": return head("Waiting for payment", `${esc(first)} is checking the work and paying on EcoCash.`, `<div class="wait" style="background:rgba(255,255,255,.08)"><span class="spin"></span><span>Don't accept cash. All payments go through Basa seBasa.</span></div>`) + `<div class="card"><h3>Your earnings</h3>${splitTable(j)}</div>`;
    case "paid": return head("Paid. Well done", `Your payout is on its way.`) + `<div class="card"><table class="split"><tr class="you"><td>You earn from this job</td><td>${usd(e.total)}</td></tr></table><p class="muted" style="font-size:14px">Sent to your EcoCash within ${P.payoutHours} hours. You'll get a WhatsApp message with the reference.</p>${j.rating ? `<p>${esc(first)} rated you <b>${"★".repeat(j.rating)}</b> ${j.review ? `"${esc(j.review)}"` : ""}</p>` : ""}<button class="btn gold" type="button" data-finish>Back to jobs</button></div>`;
  }
  return "";
}
function quoteForm(j) {
  return `<div class="card"><h3>Diagnose and quote</h3>
    <div class="photos"><label class="photo ${j.beforePhoto ? "done" : ""}"><input type="file" accept="image/*" capture="environment" id="before-photo">${j.beforePhoto ? "✓ Photo added" : "Photo of the fault"}<small class="muted">${j.beforePhoto ? esc(j.beforePhoto) : "Recommended"}</small></label><div class="photo" style="cursor:default;border-style:solid"><b>${fmt(Date.now() - j.arrivedAt)}</b><small class="muted">on site</small></div></div>
    <div class="field"><label for="diag">What's wrong?</label><textarea id="diag" placeholder="e.g. Start relay burnt out. Compressor is fine."></textarea></div>
    <div class="two"><div class="field"><label for="labour">Labour (USD)</label><input id="labour" type="number" min="0" step="1" inputmode="decimal" placeholder="40"></div><div class="field"><label for="parts">Parts (USD)</label><input id="parts" type="number" min="0" step="1" inputmode="decimal" placeholder="0"></div></div>
    <div id="preview">${splitTable({ ...j, quote: { labour: 0, parts: 0 } })}</div>
    <p class="err" id="q-err" hidden></p><button class="btn gold" type="button" data-quote>Send quote to ${esc(j.customer.split(" ")[0])}</button>
    <p class="muted" style="font-size:13.5px;text-align:center">Never start a repair before the customer approves.</p></div>`;
}
function startCard(j) {
  return `<div class="card"><h3>Start the job</h3>${j.type !== "Repair" ? `<div class="photos"><label class="photo ${j.beforePhoto ? "done" : ""}"><input type="file" accept="image/*" capture="environment" id="before-photo">${j.beforePhoto ? "✓ Before photo" : "Before photo"}<small class="muted">${j.beforePhoto ? esc(j.beforePhoto) : "Recommended"}</small></label><div class="photo" style="cursor:default;border-style:solid"><b>${usd(j.agreed)}</b><small class="muted">agreed price</small></div></div>` : ""}
    <p class="muted">The timer records how long the job takes, so customers can trust the work was done.</p><button class="btn gold" type="button" data-start>Start job timer</button></div>`;
}
function splitTable(j) {
  const e = earnings(j);
  return `<table class="split">${e.callout ? `<tr><td>Call-out (your share)</td><td>${usd(e.callout)}</td></tr>` : ""}${e.travel ? `<tr><td>Extra travel</td><td>${usd(e.travel)}</td></tr>` : ""}<tr><td>Labour</td><td>${usd(e.labour)}</td></tr><tr><td>Basa seBasa fee (${P.commission}% of labour)</td><td>−${usd(e.fee)}</td></tr>${e.parts ? `<tr><td>Parts (100% yours)</td><td>${usd(e.parts)}</td></tr>` : ""}<tr class="you"><td>You get</td><td>${usd(e.total)}</td></tr></table>`;
}
const workMs = (j) => (j.pausedAt || Date.now()) - j.startedAt - (j.pausedTotal || 0);

function viewEarnings() {
  const now = Date.now(); const week = S.done.filter((d) => now - d.at < 7 * 864e5);
  const pending = S.done.filter((d) => now < d.at + P.payoutHours * 36e5 && !d.paidOut);
  return `<h2>Earnings</h2>
    <div class="kpis"><div class="kpi lead"><span class="eyebrow">This week</span><b>${usd(week.reduce((s, d) => s + d.earned, 0))}</b><span style="color:#B9B2A2;font-size:13.5px">${week.length} jobs</span></div><div class="kpi"><span class="eyebrow">Payout pending</span><b>${usd(pending.reduce((s, d) => s + d.earned, 0))}</b><span class="muted" style="font-size:13.5px">Within ${P.payoutHours} h of payment</span></div></div>
    <div class="card"><h3>Payouts</h3>${S.done.length ? S.done.map((d) => { const due = d.at + P.payoutHours * 36e5; const left = due - now; return `<div class="row"><span><b>${esc(d.item)}</b><small>${new Date(d.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · ${esc(d.id)}</small></span><span class="amt">${usd(d.earned)}<br><span class="pill ${left <= 0 ? "good" : ""}">${left <= 0 ? "Paid to EcoCash" : "Due in " + Math.max(1, Math.round(left / 36e5)) + " h"}</span></span></div>`; }).join("") : `<p class="muted">Your completed jobs and payouts appear here.</p>`}</div>
    <div class="card"><h3>How you're paid</h3><p class="muted">Customers pay Basa seBasa on EcoCash. We send your share to your EcoCash number within ${P.payoutHours} hours: ${100 - P.commission}% of labour, all of the parts, $${P.callout - P.calloutPlatform} of each $${P.callout} call-out, and any extra travel.</p></div>`;
}
function viewHistory() {
  return `<h2>History</h2><div class="card">${S.done.length ? S.done.map((d) => `<div class="row"><span><b>${esc(d.item)}</b><small>${esc(d.suburb)} · ${esc(d.type)} · ${d.minutes ? d.minutes + " min on the job" : "call-out only"}</small></span><span class="amt">${d.rating ? "★".repeat(d.rating) : "—"}<br><small>${usd(d.earned)}</small></span></div>`).join("") : `<div class="empty"><h3>No jobs yet</h3><p class="muted">Go online to get your first job.</p></div>`}</div>`;
}
function viewProfile() {
  return `<h2>Profile</h2>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span><span class="eyebrow">Trust Score</span><b style="display:block;font-family:var(--display);font-size:54px;line-height:1">${ME.trust}<span class="muted" style="font-size:22px">/100</span></b></span><span class="pill good">Verified</span></div>
      <p class="muted">Customers see this before they choose you. It comes from your checks, experience, ratings and jobs done.</p></div>
    <div class="card"><h3>Checks</h3><div class="checks">${Object.entries(ME.checks).map(([k, v]) => `<div><span>${esc(k)}</span><span class="${v ? "ok" : "no"}">${v ? "✓ Checked" : "Not yet"}</span></div>`).join("")}</div></div>
    <div class="card"><h3>Raise your score</h3><ul style="margin:0;padding-left:20px;display:grid;gap:6px"><li>Add a police clearance: <b>+10</b></li><li>Accept jobs quickly and arrive on time</li><li>Send before and after photos on every job</li><li>Never ask a customer for cash</li></ul></div>
    <div class="card"><h3>Your details</h3><div class="checks"><div><span>Trade</span><span>Fridge &amp; aircon</span></div><div><span>Based in</span><span>${esc(ME.suburb)}</span></div><div><span>Experience</span><span>${ME.years} years</span></div><div><span>EcoCash for payouts</span><span class="mono">077 ••• 0001</span></div></div></div>`;
}

// ================= LIVE BITS =================
let raf = 0;
function startMap() {
  cancelAnimationFrame(raf);
  const j = S.job, route = document.getElementById("route"), dot = document.getElementById("dot"); if (!route) return;
  const len = route.getTotalLength(), dur = 25000 / SPEED, eta0 = Math.round(8 + j.km * 2.4);
  const tick = () => {
    if (!document.getElementById("route") || S.job?.stage !== "travelling") return;
    const f = Math.min(1, (Date.now() - j.tripAt) / dur); const pt = route.getPointAtLength(len * f);
    dot.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
    const eta = document.getElementById("eta"); if (eta) eta.textContent = f >= 1 ? "You're here" : `${Math.max(1, Math.round(eta0 * (1 - f)))} min · ${r2(j.km * (1 - f)).toFixed(1)} km`;
    if (f < 1) raf = requestAnimationFrame(tick);
  };
  tick();
}
setInterval(() => {
  if (S.request && S.tab === "jobs") {
    const left = Math.max(0, Math.ceil((S.request.expires - Date.now()) / 1000));
    const c = $("#count"), b = $("#bar"); if (c) c.textContent = left + "s"; if (b) b.style.width = (left / P.acceptSeconds) * 100 + "%";
    if (left <= 0) { S.request = null; toast("Request expired. It went to the next pro."); render(); scheduleRequest(6000); }
  }
  if (S.job?.stage === "working") { const t = $("#timer"); if (t) t.textContent = fmt(workMs(S.job)); }
}, 1000);

// ================= ACTIONS =================
function finishJob(earned, minutes) { const j = S.job; S.done.unshift({ id: j.id, item: j.item, type: j.type, suburb: j.suburb, at: Date.now(), earned, minutes, rating: j.rating || 0 }); persist(); S.job = null; render(); if (S.online) scheduleRequest(5000); }
document.addEventListener("change", (e) => {
  if (e.target.id === "online") { S.online = e.target.checked; if (!S.online) { S.request = null; toast("You're offline. No new jobs."); } else { toast("You're online. Location sharing is on."); scheduleRequest(); } render(); }
  if (e.target.id === "before-photo" || e.target.id === "after-photo") { const f = e.target.files?.[0]; if (f && S.job) { S.job[e.target.id === "before-photo" ? "beforePhoto" : "afterPhoto"] = f.name; render(); } }
});
document.addEventListener("input", (e) => {
  if ((e.target.id === "labour" || e.target.id === "parts") && S.job) { const prev = $("#preview"); if (prev) prev.innerHTML = splitTable({ ...S.job, quote: { labour: Number($("#labour").value) || 0, parts: Number($("#parts").value) || 0 } }); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, a[data-tab]"); if (!b) return;
  const j = S.job;
  if (b.hasAttribute("data-go-online")) { S.online = true; toast("You're online. Location sharing is on."); scheduleRequest(); render(); }
  else if (b.hasAttribute("data-decline")) { S.request = null; toast("Declined. We'll send the next job."); render(); scheduleRequest(7000); }
  else if (b.hasAttribute("data-accept")) {
    const r = S.request; S.request = null; S.job = { ...r, stage: r.type === "Repair" ? "await_callout" : "ready", acceptedAt: Date.now() }; render();
    if (r.type === "Repair") sim("ready", 5000, "Call-out paid. You can leave now."); else toast(`Accepted. ${r.customer.split(" ")[0]} has been told.`);
  }
  else if (b.hasAttribute("data-trip")) { j.stage = "travelling"; j.tripAt = Date.now(); toast(`${j.customer.split(" ")[0]} can see you on the map.`); render(); }
  else if (b.hasAttribute("data-arrived")) { j.stage = "arrived"; j.arrivedAt = Date.now(); toast(`${j.customer.split(" ")[0]} has been told you've arrived.`); render(); }
  else if (b.hasAttribute("data-quote")) {
    const diag = $("#diag").value.trim(), lab = Number($("#labour").value), parts = Number($("#parts").value) || 0, err = $("#q-err");
    if (diag.length < 5) { err.textContent = "Describe what's wrong so the customer understands."; err.hidden = false; return; }
    if (!(lab > 0)) { err.textContent = "Enter the labour price."; err.hidden = false; return; }
    j.quote = { labour: lab, parts, diagnosis: diag }; j.stage = "quote_sent"; render();
    // the preview's sample customer says yes to most quotes, and defers the expensive ones
    if (lab + parts > 150) sim("deferred", 6000, "The customer will repair later. You keep the call-out.");
    else sim("approved", 6000, "Quote approved. You can start.");
  }
  else if (b.hasAttribute("data-start")) { j.stage = "working"; j.startedAt = Date.now(); j.pausedTotal = 0; j.pausedAt = null; render(); }
  else if (b.hasAttribute("data-pause")) { if (j.pausedAt) { j.pausedTotal += Date.now() - j.pausedAt; j.pausedAt = null; } else j.pausedAt = Date.now(); render(); }
  else if (b.hasAttribute("data-complete")) {
    const err = $("#done-err"); if (!j.afterPhoto) { err.textContent = "Add an after photo first. It protects you if there's a dispute."; err.hidden = false; return; }
    j.minutes = Math.max(1, Math.round(workMs(j) / 6e4)); j.notes = $("#notes").value.trim(); j.stage = "await_payment"; render();
    later(7000, () => { if (S.job !== j) return; j.stage = "paid"; j.rating = 5; j.review = "On time and explained everything."; toast("Customer paid. Your payout is on its way."); render(); });
  }
  else if (b.hasAttribute("data-finish")) finishJob(earnings(j).total, j.minutes);
  else if (b.hasAttribute("data-finish-deferred")) finishJob(earnings(j).upfront, 0);
  else if (b.hasAttribute("data-chat")) toast("In the live app this opens WhatsApp with the customer.");
});
function route() { const h = location.hash.slice(1); S.tab = ["jobs", "earnings", "history", "profile"].includes(h) ? h : "jobs"; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
route();
})();
</script>

</body>
</html>
